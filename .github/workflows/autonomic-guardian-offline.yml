name: Autonomic Guardian offline
on:
  push:
    paths:
      - "autonomic_guardian/**"
      - ".github/workflows/autonomic-guardian-offline.yml"
  pull_request:
    paths:
      - "autonomic_guardian/**"
      - ".github/workflows/autonomic-guardian-offline.yml"
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline unit tests
        run: python -I -B -m unittest discover -s autonomic_guardian/tests -v
