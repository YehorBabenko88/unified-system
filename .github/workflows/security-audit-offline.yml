name: Five-repo security audit offline regressions
on:
  push:
    paths:
      - "security_audit/**"
      - ".github/workflows/security-audit-offline.yml"
  pull_request:
    paths:
      - "security_audit/**"
      - ".github/workflows/security-audit-offline.yml"
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s security_audit/tests -v
