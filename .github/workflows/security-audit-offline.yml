name: Six-repo security audit offline regressions
on:
  push:
    paths:
      - "security_audit/**"
      - ".github/workflows/security-audit-offline.yml"
  pull_request:
    paths:
      - "security_audit/**"
      - ".github/workflows/security-audit-offline.yml"
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s security_audit/tests -v

  history-objects:
    # No project code from the six repositories is executed.
    # Raw credential candidates never appear in stdout or uploaded artifacts.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch public Git refs into isolated bare mirrors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unified-security-mirrors"
          for repo in bybit-cluster-grid strattester math unified-system Terminan meta_analyse; do
            git -c credential.helper= clone --quiet --mirror \
              "https://github.com/YehorBabenko88/${repo}.git" \
              "$RUNNER_TEMP/unified-security-mirrors/${repo}.git"
          done
      - name: Scan historical reachable Git objects; redact candidates
        shell: bash
        env:
          SECURITY_MIRRORS: ${{ runner.temp }}/unified-security-mirrors
        run: |
          python -B - <<'PY'
          import os
          import sys
          from pathlib import Path
          from security_audit.offline_inventory import REPOS, scan_git_history
          blocked = False
          for name in REPOS:
              report = scan_git_history(Path(os.environ["SECURITY_MIRRORS"]) / (name + ".git"), stream_large_blobs=True)
              candidates = sum(report["redacted_secret_shape_counts"].values())
              print(
                  f"{name}: refs={report['local_refs']} "
                  f"pr_refs={report['local_pr_head_refs']} "
                  f"blobs_examined={report['blob_objects_examined']} "
                  f"oversize={report['oversize_blob_objects_unscanned']} "
                  f"oversize_streamed={report['oversize_blob_objects_streamed']} "
                  f"lfs_pointers={report['git_lfs_pointers']} "
                  f"redacted_candidate_objects={candidates} "
                  f"clearance={report['full_security_clearance']}"
              )
              if (candidates or not report["local_ref_scan_complete"]
                      or report["local_pr_head_refs"] == 0):
                  blocked = True
          print("This is a local-ref shape scan, NOT Gitleaks/TruffleHog clearance.")
          if blocked:
              sys.exit("Security review required: object scan findings or incomplete scope")
          PY
