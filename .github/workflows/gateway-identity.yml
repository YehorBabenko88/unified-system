name: Gateway disposable identity
on:
  push:
    paths: ['unified_system/gateway_identity.py', 'tests/test_gateway_identity.py', 'docs/intelligence/identity/**', '.github/workflows/gateway-identity.yml']
  pull_request:
    paths: ['unified_system/gateway_identity.py', 'tests/test_gateway_identity.py', 'docs/intelligence/identity/**', '.github/workflows/gateway-identity.yml']
permissions:
  contents: read
jobs:
  identity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            lock: windows
          - os: ubuntu-24.04
            lock: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - shell: bash
        run: python -m pip install --only-binary=:all: --require-hashes -r docs/intelligence/identity/requirements-${{ matrix.lock }}.lock
      - shell: bash
        run: python -I -B docs/intelligence/identity/run_qualification.py --expected-head "$(git rev-parse HEAD)"
