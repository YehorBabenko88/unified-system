name: LAB_SIMULATION managed E2E (Workstream C, MASTER #111)
# First managed start of Grid market_data + Math + Terminan under Unified's
# LAB_SIMULATION admission. Loopback only, no trading, no credentials,
# synthetic/no data. Release status stays NO_GO.
on:
  pull_request:
  push:
    branches: ['claude/c-lab-startup-admission-*']
permissions:
  contents: read
jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GRID_SHA: bf9cbe8949dd1a2979aa7d63a55e2df9e139d625
      MATH_SHA: 9e6acbd9e12a91189f57234828e31640983af553
      TERMINAN_SHA: 353d16b2126609579018fafe3f76047b465bb289
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: unified
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/bybit-cluster-grid
          ref: ${{ env.GRID_SHA }}
          path: grid
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/math
          ref: ${{ env.MATH_SHA }}
          path: math
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/Terminan
          ref: ${{ env.TERMINAN_SHA }}
          path: terminan
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Unit controls (temporary copies; no bytecode in admitted trees)
        working-directory: unified
        run: python -B -m unittest tests.test_lab_simulation -v
      - name: Plan, authorize (LAB only, 1h) and run the managed E2E
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys, time
          w = pathlib.Path.cwd().resolve()
          def head(p): return subprocess.check_output(['git', '-C', str(w / p), 'rev-parse', 'HEAD'], text=True).strip()
          spec = dict(release_id='lab-e2e-ci', dependency_roots=[], sources=dict(
              unified_system=dict(root=str(w / 'unified/unified_system'), import_root=str(w / 'unified'), commit=head('unified'), version='0.1.0'),
              market_data=dict(root=str(w / 'grid/market_data'), import_root=str(w / 'grid'), commit=head('grid'), version='0.1.0'),
              math=dict(root=str(w / 'math/python'), import_root=str(w / 'math/python'), commit=head('math'), version='0.1.0'),
              terminan=dict(root=str(w / 'terminan/terminan'), import_root=str(w / 'terminan'), commit=head('terminan'), version='0.1.0')))
          assert spec['sources']['market_data']['commit'] == os.environ['GRID_SHA']
          (w / 'sources.json').write_text(json.dumps(spec))
          run = lambda *a: subprocess.run([sys.executable, '-B', '-m', 'unified_system.lab_simulation', *a], cwd=w / 'unified', capture_output=True, text=True)
          plan = run('plan', '--sources', str(w / 'sources.json'))
          print(plan.stdout, plan.stderr); assert plan.returncode == 0
          digest = json.loads(plan.stdout)['components_sha256']
          now = int(time.time() * 1000)
          (w / 'auth.json').write_text(json.dumps(dict(schema='unified.lab-simulation-authorization.v1', mode='LAB_SIMULATION',
              components_sha256=digest, release_id='lab-e2e-ci', issued_at_ms=now, expires_at_ms=now + 3600_000,
              loopback_only=True, trading_authorized=False, production_credentials=False,
              operator='github-actions LAB E2E (owner decision unified-system#111)')))
          # Negative control: a wrong digest must start nothing.
          bad = json.loads((w / 'auth.json').read_text()); bad['components_sha256'] = 'f' * 64
          (w / 'bad.json').write_text(json.dumps(bad))
          refused = run('run', '--sources', str(w / 'sources.json'), '--authorization', str(w / 'bad.json'))
          print(refused.stdout); assert refused.returncode == 1 and 'COMPONENTS_MISMATCH' in refused.stdout
          result = run('run', '--sources', str(w / 'sources.json'), '--authorization', str(w / 'auth.json'), '--report', str(w / 'lab-e2e-report.json'))
          print(result.stdout, result.stderr)
          assert result.returncode == 0
          report = json.loads((w / 'lab-e2e-report.json').read_text())
          assert report['stopped'] and report['cleaned'] and report['unauthenticated_denied']
          assert report['trading_authorized'] is False and report['production'] == 'NO_GO'
          for m in ('market_data', 'terminan'):
              assert report['modules'][m]['ready'] and report['modules'][m]['exit_code'] == 0, m
          assert report['terminan_status']['body']['market_data_source']['connection'] == 'CONNECTED_UNQUALIFIED'
          print('LAB_E2E=PASS_SCOPED; data=UNQUALIFIED_NO_ROWS; production=NO_GO')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab-e2e-${{ matrix.os }}
          path: lab-e2e-report.json
          if-no-files-found: warn
