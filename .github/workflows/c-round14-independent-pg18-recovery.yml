name: C Round14 independent isolated PG18 recovery (LAB only)
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: c-r14-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  c-owned-recovery-pg18:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAB_POSTGRES_BIN: /usr/lib/postgresql/18/bin
      LAB_C_PG18_NATIVE_TEST: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout exact A-owned OS evidence source for isolated native cohort
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/unified-system
          ref: 5331f0fb4e684d94d2229bdca00596bd9f018fe9
          path: upstream/a-retained-os
          persist-credentials: false
      - name: Verify A source Git blob before test-only overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream/a-retained-os rev-parse HEAD)" = "5331f0fb4e684d94d2229bdca00596bd9f018fe9"
          test "$(git hash-object upstream/a-retained-os/unified_system/runtime_process.py)" = "33de1ee10f30c7cf57567e029808f7991db2c1aa"
          # Test checkout only: A owns this source. C never commits an
          # alternative process observer or copies A into the PR branch.
          cp upstream/a-retained-os/unified_system/runtime_process.py unified_system/runtime_process.py
          test "$(git hash-object unified_system/runtime_process.py)" = "33de1ee10f30c7cf57567e029808f7991db2c1aa"
      - name: Checkout E-owned exact fenced identity model for C SQL binding
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/unified-system
          ref: cc180dae986d72c774c3654acaa0fc10be1d4652
          path: upstream/e-identity
          persist-credentials: false
      - name: Verify E model source blob in test-only workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream/e-identity rev-parse HEAD)" = "cc180dae986d72c774c3654acaa0fc10be1d4652"
          test "$(git hash-object upstream/e-identity/unified_system/grid_writer_fence_model.py)" = "86a284b4b505e0d96f147afb8be08eb79e10b07b"
          cp upstream/e-identity/unified_system/grid_writer_fence_model.py unified_system/grid_writer_fence_model.py
          test "$(git hash-object unified_system/grid_writer_fence_model.py)" = "86a284b4b505e0d96f147afb8be08eb79e10b07b"
      - name: Checkout immutable legacy checkpoint SQL source for original C35 A/B
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/unified-system
          ref: a4d8b66904b2a70c55799aa16e204f7df953692f
          path: upstream/c-legacy-checkpoint
          persist-credentials: false
      - name: Verify both original checkpoint SQL source blobs (not adapted SQL)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream/c-legacy-checkpoint rev-parse HEAD)" = "a4d8b66904b2a70c55799aa16e204f7df953692f"
          test "$(git hash-object upstream/c-legacy-checkpoint/unified_system/lab_pg_checkpoint.py)" = "cad4ccf970470eb86a487c484cee9be15ea9614d"
          test "$(git hash-object unified_system/lab_pg_checkpoint.py)" = "076980d9556bf3a685091f16129ef321cb1372be"
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install PostgreSQL 18 binaries without provisioning main or port 5432
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /etc/postgresql-common/createcluster.d
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.d/no-main.conf
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-18
          "$LAB_POSTGRES_BIN/postgres" --version
      - name: Install pinned PostgreSQL Python client
        shell: bash
        run: |
          python -m pip install "psycopg[binary]==3.3.6"
      - name: Compile exact C recovery sources and test module
        run: |
          python -m py_compile unified_system/grid_writer_fence_model.py unified_system/runtime_process.py unified_system/lab_postgres.py unified_system/lab_pg_fence.py unified_system/lab_pg_checkpoint.py unified_system/lab_pg_recovery.py tests/test_c_round14_pg_recovery.py tests/c_round35_sql_variants_probe.py
      - name: Run exactly 29 native PostgreSQL18 recovery cases (zero skip)
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import unittest
          from tests import test_c_round14_pg_recovery
          suite=unittest.defaultTestLoader.loadTestsFromModule(test_c_round14_pg_recovery)
          count=suite.countTestCases()
          if count != 29:
              raise SystemExit(f"C_R14_RECOVERY_ROSTER_UNEXPECTED:{count}")
          outcome=unittest.TextTestRunner(verbosity=2).run(suite)
          if outcome.testsRun!=count or outcome.skipped or not outcome.wasSuccessful():
              raise SystemExit("C_R14_RECOVERY_NATIVE_PG18_DENIED")
          print(f"C_R14_RECOVERY_NATIVE_PASS={count};SKIPS=0")
          print("ISOLATED_LAB_ONLY;NO_ROOT_RECEIPT;CODE_NO_GO;PRODUCTION_NO_GO")
          PY
