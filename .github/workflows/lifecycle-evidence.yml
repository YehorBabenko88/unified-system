name: Five-module lifecycle evidence
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install hash-pinned full-suite test dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r docs/ci/requirements-unittest.lock
      - run: python -I -S -B scripts/bootstrap_ci_unittest.py
      - name: Exact-head software evidence
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          value={'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'run':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'scope':'SYNTHETIC_ONLY','physical':'NOT_RUN','production':'NO_GO'}
          p=pathlib.Path('lifecycle-evidence.json');p.write_text(json.dumps(value,sort_keys=True),encoding='utf-8')
          pathlib.Path('lifecycle-evidence.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest(),encoding='utf-8')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lifecycle-${{ matrix.os }}
          path: lifecycle-evidence.*
