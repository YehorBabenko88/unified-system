name: Gateway disposable authenticated READ qualification
on:
  pull_request:
    paths: ['unified_system/gateway_runtime_composition.py', 'unified_system/gateway_identity.py', 'unified_system/storage/**', 'tests/gateway_runtime/**', 'tests/storage/**', 'docs/intelligence/runtime-integration/**', 'release/evidence/gateway-runtime-synthetic-profile-review1/**', '.github/workflows/gateway-runtime-integration.yml']
  push:
    branches: [integration/gateway-runtime-20261107]
permissions:
  contents: read
jobs:
  read:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            lock: windows
          - os: ubuntu-24.04
            lock: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_NO_REPLACE_OBJECTS: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
      GRID_GATEWAY_SOURCE_ROOT: ${{ runner.temp }}/grid-gateway-f19
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install only hash-pinned disposable cryptography dependencies
        shell: bash
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r docs/intelligence/identity/requirements-${{ matrix.lock }}.lock
      - name: Provision one exact public Grid source revision outside Unified checkout
        shell: python -I -S -B {0}
        run: |
          import os,pathlib,subprocess,sys
          target=pathlib.Path(os.environ['GRID_GATEWAY_SOURCE_ROOT'])
          assert not target.exists()
          target.mkdir()
          git='C:/Program Files/Git/cmd/git.exe' if sys.platform=='win32' else '/usr/bin/git'
          def run(*args):
              subprocess.run([git,'--no-replace-objects','-C',str(target),*args],check=True,timeout=120)
          run('init')
          run('config','core.autocrlf','false')
          run('remote','add','origin','https://github.com/YehorBabenko88/bybit-cluster-grid.git')
          run('fetch','--depth=1','origin','f19f7feee0f63da34a20607a8cae59191180aa7c')
          run('checkout','--detach','f19f7feee0f63da34a20607a8cae59191180aa7c')
      - name: Exact unique READ and dependency regressions with primary object guards
        shell: bash
        run: |
          python -I -B docs/intelligence/runtime-integration/run_read_qualification.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gateway-read-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gateway-read-qualification.json
          if-no-files-found: error
