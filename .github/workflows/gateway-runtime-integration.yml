name: Gateway disposable authenticated READ qualification
on:
  pull_request:
    paths: ['unified_system/gateway_runtime_composition.py', 'unified_system/market_data_query.py', 'unified_system/gateway_identity.py', 'unified_system/storage/**', 'tests/gateway_runtime/**', 'tests/storage/**', 'docs/intelligence/runtime-integration/**', 'docs/intelligence/identity/**', 'tests/test_gateway_identity.py', 'tests/test_intelligence_gateway.py', 'release/evidence/gateway-runtime-synthetic-profile-review1/**', 'integration/four_owner/**', 'integration/source_guard.py', '.gitattributes', 'unified_system/journal.py', 'unified_system/intelligence_gateway.py', 'scripts/qualify_four_owner.py', 'scripts/emit_cohort_checkout_pins.py', '.github/workflows/gateway-runtime-integration.yml']
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gateway-read-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: root
jobs:
  read:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            lock: windows
          - os: ubuntu-24.04
            lock: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_NO_REPLACE_OBJECTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: root
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Derive exact canonical source refs from the Root cohort
        id: sdk-pins
        shell: python -I -S -B {0}
        run: |
          import runpy
          runpy.run_path('scripts/emit_cohort_checkout_pins.py',run_name='not_main')['main'](['--cohort','integration/four_owner/cohort.json'])
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          repository: YehorBabenko88/strattester
          ref: ${{ steps.sdk-pins.outputs.market_data }}
          path: .source/market_data
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          repository: YehorBabenko88/math
          ref: ${{ steps.sdk-pins.outputs.math }}
          path: .source/math
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          repository: YehorBabenko88/Terminan
          ref: ${{ steps.sdk-pins.outputs.terminan }}
          path: .source/terminan
          persist-credentials: false
          fetch-depth: 0
      - name: Install only hash-pinned disposable cryptography dependencies
        shell: bash
        run: python -m pip install --force-reinstall --no-deps --only-binary=:all: --require-hashes -r docs/intelligence/identity/requirements-${{ matrix.lock }}.lock
      - name: Build and qualify all three actual canonical SDK wheels
        shell: python -I -S -B {0}
        run: |
          import os,pathlib,subprocess,sys
          workspace=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          source=workspace/'.source'
          subprocess.run([sys.executable,'-I','-S','-B','scripts/qualify_four_owner.py','--root-head',os.environ['EXPECTED_HEAD'],'--market-data',str(source/'market_data'),'--math',str(source/'math'),'--terminan',str(source/'terminan'),'--out',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'gateway-read-sdk')],check=True,timeout=900)
      - name: Exact READ roles with raw Git installed SDK and fresh cache custody
        shell: python -I -S -B {0}
        run: |
          import os,pathlib,subprocess,sys
          cache=pathlib.Path(os.environ['RUNNER_TEMP'])/'gateway-read-import-cache'
          subprocess.run([sys.executable,'-I','-S','-B','-X','pycache_prefix='+str(cache),'docs/intelligence/runtime-integration/run_read_qualification.py'],check=True,timeout=600)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gateway-read-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gateway-read-qualification.json
            ${{ runner.temp }}/gateway-read-sdk/evidence.json
            ${{ runner.temp }}/gateway-read-sdk/installed-tests.json
            ${{ runner.temp }}/gateway-read-sdk/installed-tests.log
          if-no-files-found: error
