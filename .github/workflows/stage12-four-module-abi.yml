name: Stage 12 four-module independent ABI gate
on:
  pull_request:
    paths:
      - "integration_tests/test_stage12_four_module_abi.py"
      - ".github/workflows/stage12-four-module-abi.yml"
  push:
    paths:
      - "integration_tests/test_stage12_four_module_abi.py"
      - ".github/workflows/stage12-four-module-abi.yml"
permissions:
  contents: read
jobs:
  independent-abi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/math
          ref: 5080c09e4165e26205a589a17e84c2f86bc370e6
          path: external/math
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/bybit-cluster-grid
          ref: 204d75f08c6a965ba4cbe485f3ee21ab96df9145
          path: external/bybit-cluster-grid
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/unified-system
          ref: 79c2730b1d1c0d7aab69bab0523108039b5a3d85
          path: external/unified-system
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/Terminan
          ref: 7b15cacb03cd51477d0d7b4254694e0db923f092
          path: external/Terminan
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/meta_analyse
          ref: 707e0d0d1e42d1495cb2213d4dc0b23f09a7521a
          path: external/meta_analyse
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/strattester
          ref: 9d8e27fdd31d66b50416308b097daf2dacfd46c3
          path: external/strattester
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned independent Grid, Math and Terminan wheels
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check setuptools==80.9.0 wheel==0.45.1
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps ./external/math ./external/Terminan ./external/bybit-cluster-grid
      - name: Enforce exact SHA and four-module ABI
        shell: bash
        run: python -B -m unittest discover -s integration_tests -p test_stage12_four_module_abi.py -v

  grid-python311:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/bybit-cluster-grid
          ref: 204d75f08c6a965ba4cbe485f3ee21ab96df9145
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Build and install standalone Grid wheel without side effects
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check setuptools==80.9.0 wheel==0.45.1
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir .grid-wheel .
          python -m pip install --no-deps .grid-wheel/*.whl
          python -c "import grid; from importlib.metadata import version; assert version('unified-grid-market-data') == '0.1.0'"
