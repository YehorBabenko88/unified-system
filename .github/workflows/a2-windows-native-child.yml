name: A2 Windows native child contract (unified-system#151)
# Real Windows PowerShell 5.1 children on both supported hosted images and all
# supported Python versions. Existing test bounds only; no protection changes.
on:
  pull_request:
  push:
    branches: ['claude/a2-powershell-env-*']
permissions:
  contents: read
jobs:
  native-child:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-pinned test dependencies
        run: 'python -m pip install --only-binary=:all: --require-hashes -r docs/ci/requirements-unittest.lock'
      - name: Native child contract, hijack negatives and previously timing-out native tests
        env:
          PYTHONPATH: tests
        run: >-
          python -B -m unittest -v
          tests.test_windows_native_child_contract
          tests.test_installation_native_diagnostic
          tests.test_installation_service
          tests.test_lab_capsule_acl
          tests.test_installation_uninstall
          tests.test_service_actuator
          tests.test_service_activation
