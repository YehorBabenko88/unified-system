name: Windows PowerShell 5.1 hardening (A2, MASTER #111)
# Real children on both supported Windows images and all supported Pythons.
# Existing 15/30 s bounds only; no bound or protection is relaxed.
on:
  pull_request:
  push:
    branches: ['claude/a2-powershell-hardening-*']
permissions:
  contents: read
jobs:
  hardening:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked test dependencies
        run: 'python -m pip install --only-binary=:all: --require-hashes -r docs/ci/requirements-unittest.lock'
      - name: Hardened launcher, poisoning negatives and former timeouts
        run: python -B -m unittest -v tests.test_windows_powershell tests.test_installation_native_diagnostic tests.test_installation_service tests.test_lab_capsule_acl
