name: Gateway real mTLS native negative composition
on:
  pull_request:
    paths: ['unified_system/gateway_native_negative.py', 'tests/gateway_native_negative/**', 'docs/intelligence/native-negative/**', 'release/integration/native-negative-v1/**', '.github/workflows/gateway-native-negative.yml']
  push:
    branches: [feature/native-negative-path-20261109]
permissions:
  contents: read
jobs:
  negative:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            lock: windows
            binary: consul.exe
          - os: ubuntu-24.04
            lock: linux
            binary: consul
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_NO_REPLACE_OBJECTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: unified
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: YehorBabenko88/bybit-cluster-grid
          ref: 2f94da511681811588e0f850a0a0e9dc4479c8b8
          path: grid
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install only hash-pinned test dependencies
        shell: bash
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r unified/docs/intelligence/research-identity/requirements-${{ matrix.lock }}.lock
      - name: Prepare one pinned owned Consul test binary outside checkout
        shell: bash
        run: |
          python -I -B unified/docs/intelligence/research-identity/fetch_consul.py --directory "$RUNNER_TEMP/native-negative-consul"
      - name: Actual internal negative composition and exact primary source guards
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CONSUL_BINARY: ${{ runner.temp }}/native-negative-consul/${{ matrix.binary }}
        run: |
          python -I -B unified/docs/intelligence/native-negative/run_qualification.py --expected-head "$EXPECTED_HEAD" --grid-root "$GITHUB_WORKSPACE/grid" --consul-binary "$CONSUL_BINARY" --evidence "$RUNNER_TEMP/native-negative-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-negative-${{ matrix.lock }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-negative-evidence/
          if-no-files-found: error
