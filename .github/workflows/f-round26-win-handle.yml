name: F Round26 Windows retained-handle qualification (diagnostic only)
on:
  push:
    branches:
      - gpt/f-round26-windows-retained-handle-20261127
    paths:
      - 'tools/f_windows_handle.py'
      - 'tools/f_wheel_qualification.py'
      - 'tests/test_f_windows_handle.py'
      - 'tests/test_f_wheel_qualification.py'
      - '.github/workflows/f-round26-win-handle.yml'
  pull_request:
    paths:
      - 'tools/f_windows_handle.py'
      - 'tools/f_wheel_qualification.py'
      - 'tests/test_f_windows_handle.py'
      - 'tests/test_f_wheel_qualification.py'
      - '.github/workflows/f-round26-win-handle.yml'
permissions:
  contents: read
jobs:
  source-syntax-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: tools
      PYTHONDONTWRITEBYTECODE: '1'
      F_I_V2_OWNER_SOURCE: .f-owner-i-checkout/unified_system/installation_service.py
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only exact I service source (no native execution)
        uses: actions/checkout@v4
        with:
          ref: 3f4262c2096767096939f86df69da57358430e35
          path: .f-owner-i-checkout
          persist-credentials: false
          sparse-checkout: |
            unified_system/installation_service.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile F source without native Windows claims
        run: python -B -m py_compile tools/f_windows_handle.py tools/f_wheel_qualification.py tests/test_f_windows_handle.py tests/test_f_wheel_qualification.py
      - name: Non-Windows path and import shadow negatives; native cases are SKIP
        run: python -B -m unittest discover -s tests -p test_f_windows_handle.py -v
      - name: Synthetic wheel RECORD and retained POSIX leaf-identity negatives
        run: python -B -m unittest discover -s tests -p test_f_wheel_qualification.py -v
  native-handle-negative:
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    env:
      PYTHONPATH: tools
      PYTHONDONTWRITEBYTECODE: '1'
      F_I_V2_OWNER_SOURCE: .f-owner-i-checkout/unified_system/installation_service.py
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only exact I service source (no native execution)
        uses: actions/checkout@v4
        with:
          ref: 3f4262c2096767096939f86df69da57358430e35
          path: .f-owner-i-checkout
          persist-credentials: false
          sparse-checkout: |
            unified_system/installation_service.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact branch and source SHA receipt
        shell: pwsh
        run: |
          git rev-parse HEAD
          git status --porcelain
          python --version
      - name: CI-only original Win32 final-path evidence (no admission change)
        shell: pwsh
        run: |
          @'
          import ctypes, ntpath, tempfile
          from pathlib import Path
          from f_windows_handle import (_api, _segments, _FILE_READ_ATTRIBUTES,
              _FILE_LIST_DIRECTORY, _FILE_SHARE_READ, _OPEN_EXISTING,
              _FILE_FLAG_OPEN_REPARSE_POINT, _FILE_FLAG_BACKUP_SEMANTICS,
              _INVALID_HANDLE)
          with tempfile.TemporaryDirectory(prefix='f-win32-path-proof-') as tmp:
              dll = _api()
              drive, parts = _segments(str(Path(tmp)))
              current = drive
              paths = [current]
              for part in parts:
                  current = ntpath.join(current, part)
                  paths.append(current)
              for expected in paths:
                  h = dll.CreateFileW(expected,
                      _FILE_READ_ATTRIBUTES | _FILE_LIST_DIRECTORY,
                      _FILE_SHARE_READ, None, _OPEN_EXISTING,
                      _FILE_FLAG_OPEN_REPARSE_POINT | _FILE_FLAG_BACKUP_SEMANTICS,
                      None)
                  if h in (None, _INVALID_HANDLE):
                      print('WIN32_PATH_OBSERVATION_OPEN_FAILED', repr(expected),
                            ctypes.get_last_error())
                      continue
                  try:
                      buf = ctypes.create_unicode_buffer(32768)
                      n = dll.GetFinalPathNameByHandleW(h, buf, len(buf), 0)
                      actual = buf.value
                      prefix = chr(92) * 2 + '?' + chr(92)
                      folded = (actual.startswith(prefix) and
                          ntpath.normcase(actual[4:]) == ntpath.normcase(expected))
                      root_equivalent = (len(expected) == 3 and
                          expected.endswith(chr(92)) and
                          actual.startswith(prefix) and
                          ntpath.normcase(actual[4:] + chr(92)) ==
                          ntpath.normcase(expected))
                      print('WIN32_PATH_OBSERVATION', repr(expected),
                            repr(actual), 'chars', n,
                            'exact_dos', folded, 'root_spelling', root_equivalent)
                  finally:
                      dll.CloseHandle(h)
          '@ | python -B -
      - name: Original F central qualifier synthetic negative regression
        run: python -B -m unittest discover -s tests -p test_f_wheel_qualification.py -v
      - name: Native Win32 retained-handle and junction gates
        # Run the independent original native security suite even when the
        # preceding wheel qualifier fails; neither suite is allowed to turn
        # the overall Windows job green if either one fails.
        if: ${{ success() || failure() }}
        run: python -B -m unittest discover -s tests -p test_f_windows_handle.py -v
