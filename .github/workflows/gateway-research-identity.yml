name: Gateway research principal native Consul
on:
  push:
    branches: [main]
    paths: ["unified_system/consul_authority.py","unified_system/authority_codec.py","unified_system/research_authority.py","unified_system/gateway_research_identity.py","unified_system/gateway_native_negative.py","unified_system/gateway_identity.py","tests/gateway_native_negative/**","tests/gateway_research_identity/**","docs/intelligence/native-negative/**","docs/intelligence/research-identity/**","docs/intelligence/canonical-native-profile/**","release/integration/native-negative-v2/**",".github/workflows/gateway-research-identity.yml"]
  pull_request:
    paths: ["unified_system/consul_authority.py","unified_system/authority_codec.py","unified_system/research_authority.py","unified_system/gateway_research_identity.py","unified_system/gateway_native_negative.py","unified_system/gateway_identity.py","tests/gateway_native_negative/**","tests/gateway_research_identity/**","docs/intelligence/native-negative/**","docs/intelligence/research-identity/**","docs/intelligence/canonical-native-profile/**","release/integration/native-negative-v2/**",".github/workflows/gateway-research-identity.yml"]
permissions:
  contents: read
jobs:
  research-principal:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            lock: windows
            executable: consul.exe
          - os: ubuntu-24.04
            lock: linux
            executable: consul
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          path: unified
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - shell: bash
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r unified/docs/intelligence/research-identity/requirements-${{ matrix.lock }}.lock
      - name: Pure canonical harness refusal calibrations
        shell: bash
        run: python -I -B unified/docs/intelligence/native-negative/canonical-v2-20261120/test_source_harness.py
      - shell: bash
        run: |
          python -I -B unified/docs/intelligence/research-identity/fetch_consul.py --directory "$RUNNER_TEMP/a2-research-consul"
      - shell: bash
        env:
          A2_RESEARCH_CONSUL_BINARY: ${{ runner.temp }}/a2-research-consul/${{ matrix.executable }}
        run: |
          set -o pipefail
          python -I -B unified/docs/intelligence/research-identity/native-profile-v3-20261120/run_qualification.py --expected-head "$EXPECTED_HEAD" --consul-binary "$A2_RESEARCH_CONSUL_BINARY" --evidence "$RUNNER_TEMP/research-principal-evidence" 2>&1 | tee "$RUNNER_TEMP/research-principal.log"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-principal-${{ matrix.lock }}-${{ env.EXPECTED_HEAD }}
          path: |
            ${{ runner.temp }}/research-principal.log
            ${{ runner.temp }}/research-principal-evidence/
          if-no-files-found: error
