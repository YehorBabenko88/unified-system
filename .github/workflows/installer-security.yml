name: Installer security PLAN_ONLY
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-security:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full offline suite
        run: python scripts/ci_unittest.py
      - name: In-memory signature and fail-closed checks PS5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $global:LASTEXITCODE=0
          try {
            & ./tests/windows/Test-SecurityPackage.ps1
            if ($LASTEXITCODE -ne 0) { throw 'NATIVE_TEST_NONZERO_EXIT' }
          } catch {
            $locations=@{'SecurityPackage.psm1'='scripts/SecurityPackage.psm1';'Test-SecurityPackage.ps1'='tests/windows/Test-SecurityPackage.ps1';'Test-AdminitPreparation.ps1'='tests/windows/Test-AdminitPreparation.ps1';'Collect-AdminitInventory.ps1'='scripts/Collect-AdminitInventory.ps1';'Build-UnifiedRelease.ps1'='scripts/Build-UnifiedRelease.ps1'}
            $name=[IO.Path]::GetFileName([string]$_.InvocationInfo.ScriptName)
            $file='tests/windows/Test-SecurityPackage.ps1';$line=1
            if ($locations.ContainsKey($name)) {$file=$locations[$name];$candidate=[int]$_.InvocationInfo.ScriptLineNumber;if($candidate -ge 1 -and $candidate -le 100000){$line=$candidate}}
            Write-Output ('::error file='+$file+',line='+$line+'::INSTALLER_SIGNATURE_NATIVE_FAILURE')
            throw
          }
      - name: In-memory signature and fail-closed checks PS7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $global:LASTEXITCODE=0
          try {
            & ./tests/windows/Test-SecurityPackage.ps1
            if ($LASTEXITCODE -ne 0) { throw 'NATIVE_TEST_NONZERO_EXIT' }
          } catch {
            $locations=@{'SecurityPackage.psm1'='scripts/SecurityPackage.psm1';'Test-SecurityPackage.ps1'='tests/windows/Test-SecurityPackage.ps1';'Test-AdminitPreparation.ps1'='tests/windows/Test-AdminitPreparation.ps1';'Collect-AdminitInventory.ps1'='scripts/Collect-AdminitInventory.ps1';'Build-UnifiedRelease.ps1'='scripts/Build-UnifiedRelease.ps1'}
            $name=[IO.Path]::GetFileName([string]$_.InvocationInfo.ScriptName)
            $file='tests/windows/Test-SecurityPackage.ps1';$line=1
            if ($locations.ContainsKey($name)) {$file=$locations[$name];$candidate=[int]$_.InvocationInfo.ScriptLineNumber;if($candidate -ge 1 -and $candidate -le 100000){$line=$candidate}}
            Write-Output ('::error file='+$file+',line='+$line+'::INSTALLER_SIGNATURE_NATIVE_FAILURE')
            throw
          }
      - name: ADMINIT preparation contract on disposable runner PS5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $global:LASTEXITCODE=0
          try {
            & ./tests/windows/Test-AdminitPreparation.ps1
            if ($LASTEXITCODE -ne 0) { throw 'NATIVE_TEST_NONZERO_EXIT' }
          } catch {
            $locations=@{'SecurityPackage.psm1'='scripts/SecurityPackage.psm1';'Test-SecurityPackage.ps1'='tests/windows/Test-SecurityPackage.ps1';'Test-AdminitPreparation.ps1'='tests/windows/Test-AdminitPreparation.ps1';'Collect-AdminitInventory.ps1'='scripts/Collect-AdminitInventory.ps1';'Build-UnifiedRelease.ps1'='scripts/Build-UnifiedRelease.ps1'}
            $name=[IO.Path]::GetFileName([string]$_.InvocationInfo.ScriptName)
            $file='tests/windows/Test-AdminitPreparation.ps1';$line=1
            if ($locations.ContainsKey($name)) {$file=$locations[$name];$candidate=[int]$_.InvocationInfo.ScriptLineNumber;if($candidate -ge 1 -and $candidate -le 100000){$line=$candidate}}
            Write-Output ('::error file='+$file+',line='+$line+'::INSTALLER_PREPARATION_NATIVE_FAILURE')
            throw
          }
      - name: ADMINIT preparation contract on disposable runner PS7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $global:LASTEXITCODE=0
          try {
            & ./tests/windows/Test-AdminitPreparation.ps1
            if ($LASTEXITCODE -ne 0) { throw 'NATIVE_TEST_NONZERO_EXIT' }
          } catch {
            $locations=@{'SecurityPackage.psm1'='scripts/SecurityPackage.psm1';'Test-SecurityPackage.ps1'='tests/windows/Test-SecurityPackage.ps1';'Test-AdminitPreparation.ps1'='tests/windows/Test-AdminitPreparation.ps1';'Collect-AdminitInventory.ps1'='scripts/Collect-AdminitInventory.ps1';'Build-UnifiedRelease.ps1'='scripts/Build-UnifiedRelease.ps1'}
            $name=[IO.Path]::GetFileName([string]$_.InvocationInfo.ScriptName)
            $file='tests/windows/Test-AdminitPreparation.ps1';$line=1
            if ($locations.ContainsKey($name)) {$file=$locations[$name];$candidate=[int]$_.InvocationInfo.ScriptLineNumber;if($candidate -ge 1 -and $candidate -le 100000){$line=$candidate}}
            Write-Output ('::error file='+$file+',line='+$line+'::INSTALLER_PREPARATION_NATIVE_FAILURE')
            throw
          }
      - name: Bind exact checkout evidence
        shell: pwsh
        env:
          TEST_SHELL: ${{ matrix.shell }}
        run: |
          @{schema='unified.security-ci.v1';head=(git rev-parse HEAD);tree=(git rev-parse 'HEAD^{tree}');run_id=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT;job=$env:GITHUB_JOB;shell=$env:TEST_SHELL;runner=$env:RUNNER_NAME;source_provenance='NOT_EVALUATED';physical='NOT_RUN';production='NO_GO'} | ConvertTo-Json | Set-Content security-evidence.json -Encoding utf8
          (Get-FileHash security-evidence.json -Algorithm SHA256).Hash | Set-Content security-evidence.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: security-evidence-${{ matrix.shell }}
          path: |
            security-evidence.json
            security-evidence.sha256
