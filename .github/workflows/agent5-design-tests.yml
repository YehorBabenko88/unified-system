name: Agent 5 isolated design tests
on:
  push:
    branches: [codex/agent5-assignment-v1-design]
  pull_request:
    paths:
      - 'tests/scheduler_design/**'
      - 'docs/scheduler/**'
      - '.github/workflows/agent5-design-tests.yml'
permissions:
  contents: read
jobs:
  isolated-fixtures:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tests/scheduler_design/requirements.txt
      - run: python -m unittest discover -s tests -v
