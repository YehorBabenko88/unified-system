name: Unified Observer offline qualification
on:
  pull_request:
    paths:
      - 'unified_system/observer/**'
      - 'tests/observer/**'
      - 'tools/observer/**'
      - 'docs/observer/**'
      - '.github/workflows/observer-offline.yml'
  push:
    branches: ['feature/unified-observer-*']
    paths:
      - 'unified_system/observer/**'
      - 'tests/observer/**'
      - 'tools/observer/**'
      - 'docs/observer/**'
      - '.github/workflows/observer-offline.yml'
permissions:
  contents: read
concurrency:
  group: observer-offline-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  observer-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-source offline tests, no network adapters or listener
        shell: python
        run: |
          import os,pathlib,subprocess,sys
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/('observer-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          subprocess.run([sys.executable,'-I','-S','-B','tools/observer/qualify_offline.py','--head',os.environ['EXPECTED_HEAD'],'--out',str(output)],check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: observer-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observer-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
