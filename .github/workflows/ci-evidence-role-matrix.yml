name: Root transferred CI evidence unit role matrix
on:
  workflow_call:
    inputs:
      matrix-sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  roles:
    if: github.repository == 'YehorBabenko88/math' && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: Root transferred unit roles linux-${{ matrix.node }}-${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: math_universe_test
          POSTGRES_USER: math_test
          POSTGRES_PASSWORD: math_test_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U math_test -d math_universe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_NO_WARNINGS: '1'
      NODE_DEBUG: ''
      NODE_DEBUG_NATIVE: ''
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Prepare exact Root matrix helper checkout
        id: matrix_bootstrap_source
        shell: bash
        env:
          ROOT_BOOTSTRAP_REF: ${{ inputs.matrix-sha }}
        run: |
          node --input-type=module <<'ROOT_MATRIX_SOURCE'
          import{mkdtempSync,lstatSync,realpathSync,appendFileSync}from'node:fs';import{join,dirname,basename,isAbsolute}from'node:path';
          const check=ok=>{if(!ok)throw Error('ROOT_HELPER_CHECKOUT_BLOCKED');};
          function rootInput(value){if(typeof value!=='string'||!/^[a-f0-9]{40}$/.test(value))throw Error('ROOT_CHECKOUT_INPUT_REFUSED');return value;}
          try{
           const ref=rootInput(process.env.ROOT_BOOTSTRAP_REF);
           check(process.env.GITHUB_ACTIONS==='true'&&process.env.RUNNER_ENVIRONMENT==='github-hosted'&&process.platform==='linux'&&process.env.GITHUB_REPOSITORY==='YehorBabenko88/math'&&['push','pull_request','workflow_dispatch'].includes(process.env.GITHUB_EVENT_NAME)&&!process.env.NODE_OPTIONS&&!process.env.NODE_PATH&&!process.env.NODE_DEBUG&&!process.env.NODE_DEBUG_NATIVE);
           const declared=process.env.GITHUB_WORKSPACE;check(typeof declared==='string'&&declared.length<=4096&&isAbsolute(declared)&&!/[\r\n\0]/.test(declared));const workspace=realpathSync(declared);check(!/[\r\n\0]/.test(workspace));
           for(let part=workspace;;part=dirname(part)){const s=lstatSync(part);check(s.isDirectory()&&!s.isSymbolicLink());if(dirname(part)===part)break;}
           check(typeof process.env.GITHUB_OUTPUT==='string'&&isAbsolute(process.env.GITHUB_OUTPUT)&&!/[\r\n\0]/.test(process.env.GITHUB_OUTPUT));
           const parent=mkdtempSync(join(workspace,'.root-role-source-'));check((lstatSync(parent).mode&0o077)===0);
           appendFileSync(process.env.GITHUB_OUTPUT,'source_sha='+ref+'\ncheckout_path='+basename(parent)+'/root\ncheckout_abs='+join(parent,'root')+'\n');console.log('ROOT_HELPER_CHECKOUT_INPUT_READY');
          }catch{console.error('ROOT_HELPER_CHECKOUT_BLOCKED');process.exitCode=1;}
          ROOT_MATRIX_SOURCE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: YehorBabenko88/unified-system
          ref: ${{ steps.matrix_bootstrap_source.outputs.source_sha }}
          path: ${{ steps.matrix_bootstrap_source.outputs.checkout_path }}
          persist-credentials: false
          fetch-depth: 1
          set-safe-directory: false
          submodules: false
          lfs: false
      - name: Verify immutable Root role source and execute exact unit roles
        shell: bash
        env:
          ROLE_MATRIX_SHA: ${{ inputs.matrix-sha }}
          ROLE_MATRIX_ROOT_CHECKOUT: ${{ steps.matrix_bootstrap_source.outputs.checkout_abs }}
          ROLE_MATRIX_API_TOKEN: ${{ github.token }}
          ROLE_MATRIX_CELL: linux-${{ matrix.node }}-${{ matrix.postgres }}
          ROLE_MATRIX_PR_NUMBER: ${{ github.event.pull_request.number }}
          ROLE_MATRIX_WORKLOAD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: math_universe_test
          PGUSER: math_test
          PGPASSWORD: math_test_ci_only
        run: |
          node --input-type=module <<'ROLE_MATRIX'
          import {mkdtempSync,mkdirSync,writeFileSync,readFileSync,lstatSync,realpathSync,openSync,fstatSync,readSync,closeSync,constants} from 'node:fs';
          import {join,dirname} from 'node:path';import {createHash} from 'node:crypto';import {spawnSync} from 'node:child_process';
          const KIT_MANIFEST = {
           "tools/ci_evidence_role_matrix/contract.mjs": "47008c4b1aa8e7b07ed7ad60712ddf0366ff318ba86d463657b7bfde9a515626",
           "tools/ci_evidence_role_matrix/reporter.mjs": "0628416798808ccc5b2a388f0fcf8738b47bd83e13213c7b2f8564e5067cbe83",
           "tools/ci_evidence_role_matrix/runner.mjs": "9cbbe9a9e7658f3de54c2ba4a9d4bd20803bffa6dccfa90400e7883e42c706fc",
           "tools/ci_evidence_role_matrix/role-plan.json": "ae8caf3476fd98336b578cf1f9b772b1e69883867af9b77e86f4e50cb33c0fde",
           "tools/ci_evidence_role_matrix/inert.mjs": "758f6db57244af5624153786ac8cf7d2252a0cfbb5bd4e605e5466c5d23781e7",
           "tools/ci_evidence_role_matrix/aggregate.mjs": "9ac181eae838f79837a960a091aa7fa14e2f5dbd5324fda313abdc7668eb17ff",
           "tools/ci_evidence_role_matrix/artifact_zip.mjs": "73bf0170a1d84329b34ed59c2669186a60867ee8dee66ad6683b617087afc15f",
           "tools/ci_evidence_role_matrix/artifact_custody.mjs": "578064c2cdec153497cbd6cafc6d372a154c266d8c1db37155801ff472c50301"
          };
          const need=value=>{if(!value)throw Error('ROLE_MATRIX_REFUSED');},hash=raw=>createHash('sha256').update(raw).digest('hex');const check=need;
          const ROOT_HTTP_BODY = Object.freeze({path:'tools/ci_evidence/http_body.mjs',sha256:'cab089a1aaac6ef495279acb4967943750604461f9e4711b06cd0a64922c4d91'});
          function readOwned(path,maximum){
           check(Number.isSafeInteger(maximum)&&maximum>0&&maximum<=131072);const fd=openSync(path,constants.O_RDONLY|constants.O_NOFOLLOW);
           try{const before=fstatSync(fd,{bigint:true});check(before.isFile()&&before.nlink===1n&&before.size>0n&&before.size<=BigInt(maximum));const raw=Buffer.alloc(maximum+1),count=readSync(fd,raw,0,raw.length,0);check(count===Number(before.size)&&count<=maximum);const after=fstatSync(fd,{bigint:true}),named=lstatSync(path,{bigint:true});check(after.isFile()&&named.isFile()&&!named.isSymbolicLink()&&after.nlink===1n&&named.nlink===1n&&['dev','ino','size','mtimeNs','ctimeNs'].every(k=>before[k]===after[k]&&after[k]===named[k]));return raw.subarray(0,count);}finally{closeSync(fd);}
          }
          function rootHead(raw,ref){check(Buffer.isBuffer(raw)&&raw.equals(Buffer.from(ref+'\n','ascii')));}
          let phase='E_BOOTSTRAP_PROFILE';
          try{
           need(process.platform==='linux'&&process.env.GITHUB_ACTIONS==='true'&&process.env.RUNNER_ENVIRONMENT==='github-hosted'&&process.env.GITHUB_REPOSITORY==='YehorBabenko88/math'&&['push','pull_request','workflow_dispatch'].includes(process.env.GITHUB_EVENT_NAME)&&!process.env.NODE_OPTIONS&&!process.env.NODE_PATH&&!process.env.NODE_DEBUG&&!process.env.NODE_DEBUG_NATIVE&&!process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN&&!process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
           const pin=process.env.ROLE_MATRIX_SHA;need(/^[a-f0-9]{40}$/.test(pin));const temp=realpathSync(process.env.RUNNER_TEMP);for(let part=temp;;part=dirname(part)){const s=lstatSync(part);need(s.isDirectory()&&!s.isSymbolicLink());if(dirname(part)===part)break;}
           const workspace=realpathSync(process.env.GITHUB_WORKSPACE),sourceDir=resolve(process.env.ROLE_MATRIX_ROOT_CHECKOUT);check(sourceDir===process.env.ROLE_MATRIX_ROOT_CHECKOUT&&dirname(dirname(sourceDir))===workspace&&/^[.]root-role-source-[A-Za-z0-9]{6}$/.test(sourceDir.slice(workspace.length+1).split('/')[0])&&sourceDir.endsWith('/root'));
           check((lstatSync(dirname(sourceDir)).mode&0o077)===0&&Number.isInteger(constants.O_NOFOLLOW)&&constants.O_NOFOLLOW>0);for(let part=join(sourceDir,'tools/ci_evidence');;part=dirname(part)){const st=lstatSync(part);check(st.isDirectory()&&!st.isSymbolicLink());if(dirname(part)===part)break;}const gitDir=lstatSync(join(sourceDir,'.git'));check(gitDir.isDirectory()&&!gitDir.isSymbolicLink());rootHead(readOwned(join(sourceDir,'.git/HEAD'),41),pin);
           const helperRaw=readOwned(join(sourceDir,'tools/ci_evidence/http_body.mjs'),131072);check(createHash('sha256').update(helperRaw).digest('hex')===ROOT_HTTP_BODY.sha256);const helper=await import('data:text/javascript;base64,'+helperRaw.toString('base64'));check(typeof helper.readHttpBody==='function');
           const root=mkdtempSync(join(temp,'root-role-matrix-'));need((lstatSync(root).mode&0o077)===0);
           const api=async path=>{const response=await fetch('https://api.github.com/repos/YehorBabenko88/unified-system/'+path,{headers:{Authorization:'Bearer '+process.env.ROLE_MATRIX_API_TOKEN,Accept:'application/vnd.github+json'},redirect:'error',signal:AbortSignal.timeout(5000)});need(response.ok);return JSON.parse((await helper.readHttpBody(response,{maxBytes:1048576,timeoutMs:5000})).toString('utf8'));};
           const trees=new Map(),commits=new Map();
           async function tree(oid){need(/^[a-f0-9]{40}$/.test(oid));if(!trees.has(oid))trees.set(oid,await api('git/trees/'+oid));const value=trees.get(oid);need(value.truncated===false&&Array.isArray(value.tree)&&value.tree.length<=4096);return value.tree;}
           async function source(ref,path){
            need(/^[a-f0-9]{40}$/.test(ref)&&/^[A-Za-z0-9_./-]+$/.test(path)&&!path.includes('..'));
            if(!commits.has(ref)){const value=await api('git/commits/'+ref);need(value.sha===ref&&/^[a-f0-9]{40}$/.test(value.tree?.sha));commits.set(ref,value.tree.sha);}
            let oid=commits.get(ref);const parts=path.split('/');
            for(let i=0;i<parts.length;i++){const entries=(await tree(oid)).filter(entry=>entry.path===parts[i]);need(entries.length===1);const entry=entries[0],last=i===parts.length-1;need(entry.type===(last?'blob':'tree')&&entry.mode===(last?'100644':'040000')&&/^[a-f0-9]{40}$/.test(entry.sha));oid=entry.sha;}
            const blob=await api('git/blobs/'+oid);need(blob.encoding==='base64'&&Number.isSafeInteger(blob.size)&&blob.size>0&&blob.size<=131072&&typeof blob.content==='string'&&blob.content.length<=200000);
            const raw=Buffer.from(blob.content,'base64');need(raw.length===blob.size&&createHash('sha1').update(Buffer.concat([Buffer.from('blob '+raw.length+'\0'),raw])).digest('hex')===oid);return raw;
           }
           function save(path,raw){need(/^[A-Za-z0-9_./-]+$/.test(path)&&!path.includes('..'));mkdirSync(dirname(join(root,path)),{recursive:true,mode:0o700});writeFileSync(join(root,path),raw,{flag:'wx',mode:0o600});}
           phase='E_RUNNER_SOURCE';for(const[path,expected]of Object.entries(KIT_MANIFEST)){const raw=await source(pin,path);need(hash(raw)===expected);save(path,raw);}
           const workflowPath='.github/workflows/ci-evidence-role-matrix.yml',workflow=await source(pin,workflowPath);save(workflowPath,workflow);
           const plan=JSON.parse(readFileSync(join(root,'tools/ci_evidence_role_matrix/role-plan.json')));need(plan.role_source==='4ba390b8e12070499d54b12e5609c683c00607ee'&&Object.keys(plan.files).length===32&&plan.files[ROOT_HTTP_BODY.path]===ROOT_HTTP_BODY.sha256);
           phase='E_ROLE_SOURCE';for(const[path,expected]of Object.entries(plan.files)){const raw=await source(plan.role_source,path);need(hash(raw)===expected);save(path,raw);}
           writeFileSync(join(root,'bootstrap-proof.json'),JSON.stringify({runner_workflow_source:pin,runner_workflow_sha256:hash(workflow),kit_hashes:{...KIT_MANIFEST,[workflowPath]:hash(workflow)}}),{flag:'wx',mode:0o600});
           phase='E_INERT_CONTROLS';const controls=spawnSync(process.execPath,[join(root,'tools/ci_evidence_role_matrix/inert.mjs')],{cwd:root,encoding:'utf8',timeout:30000,maxBuffer:131072,env:{NODE_NO_WARNINGS:'1'}});need(!controls.error&&controls.status===0&&controls.signal===null&&controls.stderr==='');
           phase='E_HOSTED_RUNNER';const child=spawnSync(process.execPath,[join(root,'tools/ci_evidence_role_matrix/runner.mjs'),root],{cwd:root,encoding:'utf8',timeout:180000,maxBuffer:131072,env:process.env});need(!child.error&&child.status===0&&child.signal===null&&child.stdout.trim()==='ROLE_MATRIX_UNIT_PASS'&&child.stderr==='');console.log('ROLE_MATRIX_CELL_COMPLETE_UNIT_ONLY');
          }catch{console.error('ROLE_MATRIX_BLOCKED:'+phase);process.exitCode=1;}
          ROLE_MATRIX
      - name: Upload closed unit-only cell receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: root-ci-evidence-unit-linux-${{ matrix.node }}-${{ matrix.postgres }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-role-matrix/roles-linux-${{ matrix.node }}-${{ matrix.postgres }}.json
          if-no-files-found: error
          retention-days: 14
