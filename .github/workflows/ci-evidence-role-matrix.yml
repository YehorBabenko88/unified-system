name: Root transferred CI evidence unit role matrix
on:
  workflow_call:
    inputs:
      matrix-sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  roles:
    if: github.repository == 'YehorBabenko88/math' && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: Root transferred unit roles linux-${{ matrix.node }}-${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: math_universe_test
          POSTGRES_USER: math_test
          POSTGRES_PASSWORD: math_test_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U math_test -d math_universe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_NO_WARNINGS: '1'
      NODE_DEBUG: ''
      NODE_DEBUG_NATIVE: ''
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Verify immutable Root role source and execute exact unit roles
        shell: bash
        env:
          ROLE_MATRIX_SHA: ${{ inputs.matrix-sha }}
          ROLE_MATRIX_API_TOKEN: ${{ github.token }}
          ROLE_MATRIX_CELL: linux-${{ matrix.node }}-${{ matrix.postgres }}
          ROLE_MATRIX_PR_NUMBER: ${{ github.event.pull_request.number }}
          ROLE_MATRIX_WORKLOAD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: math_universe_test
          PGUSER: math_test
          PGPASSWORD: math_test_ci_only
        run: |
          node --input-type=module <<'ROLE_MATRIX'
          import {mkdtempSync,mkdirSync,writeFileSync,readFileSync,lstatSync,realpathSync} from 'node:fs';
          import {join,dirname} from 'node:path';import {createHash} from 'node:crypto';import {spawnSync} from 'node:child_process';
          const KIT_MANIFEST = {
            "tools/ci_evidence_role_matrix/contract.mjs": "494b6756817a2a63f2342f5b8b086817210fbcd280b8e31540ecc3d9fb82a372",
            "tools/ci_evidence_role_matrix/reporter.mjs": "0628416798808ccc5b2a388f0fcf8738b47bd83e13213c7b2f8564e5067cbe83",
            "tools/ci_evidence_role_matrix/runner.mjs": "5188a7e3717a27871daa70b688bb3fd15731fabccb9705acb0b4dc82a88cc531",
            "tools/ci_evidence_role_matrix/role-plan.json": "f10588add861f403fd9d3a9f3b0253942d78c0179477af9f02abdc15a7034ac4",
            "tools/ci_evidence_role_matrix/inert.mjs": "6091d47649ddfacf0b39c1859af7037a532c4701563764e4f65beb2871b48cd3",
            "tools/ci_evidence_role_matrix/aggregate.mjs": "9ac181eae838f79837a960a091aa7fa14e2f5dbd5324fda313abdc7668eb17ff",
            "tools/ci_evidence_role_matrix/artifact_zip.mjs": "73bf0170a1d84329b34ed59c2669186a60867ee8dee66ad6683b617087afc15f",
            "tools/ci_evidence_role_matrix/artifact_custody.mjs": "a0d707e9f0dbca8bf1e77e03d9eca906325dd02f42bce50f9965f5705a98cb6d"
          };
          const need=value=>{if(!value)throw Error('ROLE_MATRIX_REFUSED');},hash=raw=>createHash('sha256').update(raw).digest('hex');
          let phase='E_BOOTSTRAP_PROFILE';
          try{
           need(process.platform==='linux'&&process.env.GITHUB_ACTIONS==='true'&&process.env.RUNNER_ENVIRONMENT==='github-hosted'&&process.env.GITHUB_REPOSITORY==='YehorBabenko88/math'&&['push','pull_request','workflow_dispatch'].includes(process.env.GITHUB_EVENT_NAME)&&!process.env.NODE_OPTIONS&&!process.env.NODE_PATH&&!process.env.NODE_DEBUG&&!process.env.NODE_DEBUG_NATIVE&&!process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN&&!process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
           const pin=process.env.ROLE_MATRIX_SHA;need(/^[a-f0-9]{40}$/.test(pin));const temp=realpathSync(process.env.RUNNER_TEMP);for(let part=temp;;part=dirname(part)){const s=lstatSync(part);need(s.isDirectory()&&!s.isSymbolicLink());if(dirname(part)===part)break;}
           const root=mkdtempSync(join(temp,'root-role-matrix-'));need((lstatSync(root).mode&0o077)===0);
           const api=async path=>{const response=await fetch('https://api.github.com/repos/YehorBabenko88/unified-system/'+path,{headers:{Authorization:'Bearer '+process.env.ROLE_MATRIX_API_TOKEN,Accept:'application/vnd.github+json'},redirect:'error',signal:AbortSignal.timeout(5000)});need(response.ok);let size=0;const chunks=[];for await(const chunk of response.body){size+=chunk.length;need(size<=1048576);chunks.push(Buffer.from(chunk));}return JSON.parse(Buffer.concat(chunks).toString('utf8'));};
           const trees=new Map(),commits=new Map();
           async function tree(oid){need(/^[a-f0-9]{40}$/.test(oid));if(!trees.has(oid))trees.set(oid,await api('git/trees/'+oid));const value=trees.get(oid);need(value.truncated===false&&Array.isArray(value.tree)&&value.tree.length<=4096);return value.tree;}
           async function source(ref,path){
            need(/^[a-f0-9]{40}$/.test(ref)&&/^[A-Za-z0-9_./-]+$/.test(path)&&!path.includes('..'));
            if(!commits.has(ref)){const value=await api('git/commits/'+ref);need(value.sha===ref&&/^[a-f0-9]{40}$/.test(value.tree?.sha));commits.set(ref,value.tree.sha);}
            let oid=commits.get(ref);const parts=path.split('/');
            for(let i=0;i<parts.length;i++){const entries=(await tree(oid)).filter(entry=>entry.path===parts[i]);need(entries.length===1);const entry=entries[0],last=i===parts.length-1;need(entry.type===(last?'blob':'tree')&&entry.mode===(last?'100644':'040000')&&/^[a-f0-9]{40}$/.test(entry.sha));oid=entry.sha;}
            const blob=await api('git/blobs/'+oid);need(blob.encoding==='base64'&&Number.isSafeInteger(blob.size)&&blob.size>0&&blob.size<=131072&&typeof blob.content==='string'&&blob.content.length<=200000);
            const raw=Buffer.from(blob.content,'base64');need(raw.length===blob.size&&createHash('sha1').update(Buffer.concat([Buffer.from('blob '+raw.length+'\0'),raw])).digest('hex')===oid);return raw;
           }
           function save(path,raw){need(/^[A-Za-z0-9_./-]+$/.test(path)&&!path.includes('..'));mkdirSync(dirname(join(root,path)),{recursive:true,mode:0o700});writeFileSync(join(root,path),raw,{flag:'wx',mode:0o600});}
           phase='E_RUNNER_SOURCE';for(const[path,expected]of Object.entries(KIT_MANIFEST)){const raw=await source(pin,path);need(hash(raw)===expected);save(path,raw);}
           const workflowPath='.github/workflows/ci-evidence-role-matrix.yml',workflow=await source(pin,workflowPath);save(workflowPath,workflow);
           const plan=JSON.parse(readFileSync(join(root,'tools/ci_evidence_role_matrix/role-plan.json')));need(plan.role_source==='006418285667b38810b7ecd1de9807b6db166fa3'&&Object.keys(plan.files).length===31);
           phase='E_ROLE_SOURCE';for(const[path,expected]of Object.entries(plan.files)){const raw=await source(plan.role_source,path);need(hash(raw)===expected);save(path,raw);}
           writeFileSync(join(root,'bootstrap-proof.json'),JSON.stringify({runner_workflow_source:pin,runner_workflow_sha256:hash(workflow),kit_hashes:{...KIT_MANIFEST,[workflowPath]:hash(workflow)}}),{flag:'wx',mode:0o600});
           phase='E_INERT_CONTROLS';const controls=spawnSync(process.execPath,[join(root,'tools/ci_evidence_role_matrix/inert.mjs')],{cwd:root,encoding:'utf8',timeout:30000,maxBuffer:131072,env:{NODE_NO_WARNINGS:'1'}});need(!controls.error&&controls.status===0&&controls.signal===null&&controls.stderr==='');
           phase='E_HOSTED_RUNNER';const child=spawnSync(process.execPath,[join(root,'tools/ci_evidence_role_matrix/runner.mjs'),root],{cwd:root,encoding:'utf8',timeout:180000,maxBuffer:131072,env:process.env});need(!child.error&&child.status===0&&child.signal===null&&child.stdout.trim()==='ROLE_MATRIX_UNIT_PASS'&&child.stderr==='');console.log('ROLE_MATRIX_CELL_COMPLETE_UNIT_ONLY');
          }catch{console.error('ROLE_MATRIX_BLOCKED:'+phase);process.exitCode=1;}
          ROLE_MATRIX
      - name: Upload closed unit-only cell receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: root-ci-evidence-unit-linux-${{ matrix.node }}-${{ matrix.postgres }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-role-matrix/roles-linux-${{ matrix.node }}-${{ matrix.postgres }}.json
          if-no-files-found: error
          retention-days: 14
