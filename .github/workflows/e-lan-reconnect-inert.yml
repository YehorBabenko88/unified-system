name: E LAN reconnect pure regression
on:
  pull_request:
    paths:
      - 'unified_system/lan_transport.py'
      - 'unified_system/grid_writer_fence_model.py'
      - 'unified_system/market_data_entry_contract.py'
      - 'unified_system/lab_release.py'
      - 'unified_system/lab_runtime.py'
      - 'unified_system/service_module_runtime.py'
      - 'unified_system/runtime_process.py'
      - 'tests/test_e_market_data_v2_entry_inert.py'
      - 'tests/test_e_root_private_read_capability_inert.py'
      - 'tests/test_grid_writer_fence_model.py'
      - 'tests/test_lan_reconnect_inert.py'
      - 'tests/test_lan_close_inert.py'
      - 'tests/test_lan_identity_inert.py'
      - 'tests/test_lan_transport.py'
      - 'tests/lan_failure_diagnostics.py'
      - '.github/workflows/e-lan-reconnect-inert.yml'
permissions:
  contents: read
jobs:
  bounded-reconnect:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate exact requested head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Run inert reconnect regressions (no native admission)
        run: python -B -m unittest discover -s tests -p 'test_lan_*_inert.py' -v
      - name: Run Grid writer-fence model regressions (no database or runtime grant)
        run: python -B -m unittest discover -s tests -p test_grid_writer_fence_model.py -v
      - name: Verify LAB-only Grid v2 entrypoint and private read-capability negatives
        run: python -B -m unittest discover -s tests -p 'test_e_*_inert.py' -v
