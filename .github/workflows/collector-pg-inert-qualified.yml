name: PG inert unit73 qualification
on:
  pull_request:
    paths: ['tools/collector/pg_*.py', 'tests/collector/test_pg_*.py', 'tools/collector/qualify_pg_inert.py', 'tests/ci/test_collector_pg_inert_qualification_source.py', '.github/workflows/collector-pg-inert-qualified.yml']
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.eol
  GIT_CONFIG_VALUE_1: lf
jobs:
  inert73:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 902a1704a16841d15d817ce17b48da1d3de19fda
          path: helper-inputs
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Exact source and inert73 only, no PG or native actions
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PG_INERT_OUT: ${{ runner.temp }}/pg-inert73-${{ github.run_id }}-${{ github.run_attempt }}
        shell: python -I -S -B {0}
        run: |
          import os,pathlib,subprocess,sys
          base=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          root=base/'source';helper=base/'helper-inputs';out=pathlib.Path(os.environ['PG_INERT_OUT'])
          assert not out.exists()
          argv=[sys.executable,'-I','-S','-B','-X','pycache_prefix='+str(out/'parent-cache'),str(root/'tools/collector/qualify_pg_inert.py'),'--parent','--root',str(root),'--helpers',str(helper),'--out',str(out)]
          subprocess.run(argv,check=True,timeout=600)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pg-inert73-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pg-inert73-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          if-no-files-found: warn
