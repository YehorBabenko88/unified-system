name: LAN Mux integrated isolated qualification
on:
  pull_request:
    paths: ['unified_system/lan_transport.py', 'unified_system/network_budget.py', 'unified_system/lan_mux_channel.py', 'tests/test_lan_transport.py', 'tests/lan_failure_diagnostics.py', 'tests/test_network_budget.py', 'tests/test_lan_mux_channel.py', 'tests/test_lan_mux_inventory.py', 'release/lan-mux-test-inventory.json', '.github/workflows/lan-mux-isolated.yml']
  push:
    branches: [mission/final-integration-20261106]
permissions:
  contents: read
jobs:
  finite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_NO_REPLACE_OBJECTS: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Exact source and versioned mandatory isolated LAN Mux inventory
        shell: python -I -B {0}
        run: |
          if __name__ == '__main__':
              import hashlib,io,json,os,pathlib,subprocess,sys,unittest
              root=pathlib.Path.cwd()
              git=pathlib.Path('C:/Program Files/Git/cmd/git.exe' if sys.platform=='win32' else '/usr/bin/git')
              def g(*args):
                  return subprocess.check_output([str(git),'--no-replace-objects','--no-optional-locks','-c','core.fsmonitor=false',*args],cwd=root)
              assert sys.flags.isolated and sys.dont_write_bytecode and sys.pycache_prefix is None
              assert g('rev-parse','HEAD').decode().strip()==os.environ['EXPECTED_HEAD']
              def receipt():
                  entries=[]
                  for row in g('ls-tree','-rz','--full-tree','HEAD').split(b'\0'):
                      if not row: continue
                      meta,name=row.split(b'\t',1);mode,kind,oid=meta.split()
                      assert mode in (b'100644',b'100755') and kind==b'blob'
                      entries.append((name.decode(),oid.decode()))
                  raw=subprocess.check_output([str(git),'--no-replace-objects','cat-file','--batch'],cwd=root,input=''.join(oid+'\n' for _,oid in entries).encode())
                  stream=io.BytesIO(raw);result={}
                  for name,oid in entries:
                      actual,kind,size=stream.readline().split();data=stream.read(int(size))
                      assert actual.decode()==oid and kind==b'blob' and stream.read(1)==b'\n'
                      path=root/name
                      assert path.is_file() and not path.is_symlink() and path.read_bytes()==data
                      result[name]=hashlib.sha256(data).hexdigest()
                  for path in root.rglob('*'):
                      rel=path.relative_to(root)
                      if '.git' in rel.parts: continue
                      assert not path.is_symlink() and not (getattr(path.lstat(),'st_file_attributes',0)&1024)
                      if path.is_file(): assert rel.as_posix() in result and path.suffix not in ('.pyc','.pyo')
                  return result
              before=receipt()
              sys.path.insert(0,str(root))
              sys.path.insert(0,str(root/'tests'))
              from test_lan_mux_inventory import validate_inventory,InventoryTests
              inventory=json.loads((root/'release/lan-mux-test-inventory.json').read_text(encoding='utf-8'))
              controls=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromTestCase(InventoryTests))
              assert controls.wasSuccessful() and controls.testsRun==9 and not controls.skipped
              loader=unittest.TestLoader();suite=unittest.TestSuite(loader.discover(str(root/'tests'),pattern=p) for p in ['test_lan_transport.py','test_network_budget.py','test_lan_mux_channel.py'])
              ids=[]
              def collect(suite):
                  for item in suite:
                      if isinstance(item,unittest.TestSuite): collect(item)
                      else: ids.append(item.id())
              collect(suite);required=validate_inventory(inventory,ids)
              result=unittest.TextTestRunner(verbosity=2).run(suite)
              assert result.wasSuccessful() and result.testsRun==len(required) and not result.skipped and not result.expectedFailures
              assert before==receipt()
              out=pathlib.Path(os.environ['RUNNER_TEMP'])/'lan-mux-integrated-evidence.json'
              out.write_text(json.dumps({'head':os.environ['EXPECTED_HEAD'],'tests':ids,'required_ids':required,'inventory_schema':inventory['schema'],'inventory_sha256':before['release/lan-mux-test-inventory.json'],'required_count':len(required),'inventory_controls':controls.testsRun,'skips':0,'source_sha256':before,'qualification':'LOOPBACK_LAN_MUX_COMPONENT_ONLY','native_admission':False,'installation_admission':False},indent=2)+'\n',encoding='utf-8')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lan-mux-integrated-${{ matrix.os }}
          path: ${{ runner.temp }}/lan-mux-integrated-evidence.json
          if-no-files-found: error
