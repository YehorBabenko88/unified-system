name: Canonical four-owner source and bounded software qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canonical-four-owner-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  source-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Read SDK checkout commits from active qualification cohort
        id: cohort
        shell: python -I -S -B {0}
        run: |
          import runpy,sys
          sys.argv=["scripts/emit_cohort_checkout_pins.py","--cohort","integration/four_owner/cohort.json"]
          runpy.run_path(sys.argv[0],run_name="__main__")
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: YehorBabenko88/strattester
          ref: ${{ steps.cohort.outputs.market_data }}
          path: .source/market_data
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: YehorBabenko88/math
          ref: ${{ steps.cohort.outputs.math }}
          path: .source/math
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: YehorBabenko88/Terminan
          ref: ${{ steps.cohort.outputs.terminan }}
          path: .source/terminan
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify retired integration custody and open obligations
        run: python -I -S -B scripts/check_retired_integration_archive.py
      - name: Exact four source fences and raw-built installed pure SDK contracts
        shell: python
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import os,pathlib,subprocess,sys
          subprocess.run([sys.executable,'-I','-B','scripts/qualify_four_owner.py','--root-head',os.environ['EXPECTED_HEAD'],'--market-data','.source/market_data','--math','.source/math','--terminan','.source/terminan','--out',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'canonical-four-sdk')],check=True)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Retained actual bounded Math worker and loopback software cases
        shell: python
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import os,pathlib,subprocess,sys
          subprocess.run([sys.executable,'-I','-B','scripts/qualify_four_owner.py','--mode','scientific-runtime','--root-head',os.environ['EXPECTED_HEAD'],'--market-data','.source/market_data','--math','.source/math','--terminan','.source/terminan','--out',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'canonical-four-scientific-runtime')],check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canonical-four-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/canonical-four-sdk/
            ${{ runner.temp }}/canonical-four-scientific-runtime/
          if-no-files-found: error
  mandatory-managed-runtime-browser:
    needs: source-integration
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Mandatory canonical managed-process pipeline and browser obligation gates
        shell: python
        env:
          SOURCE_JOB_RESULT: ${{ needs.source-integration.result }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import json,os,pathlib,subprocess,sys
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'canonical-four-runtime-obligations'
          out.mkdir(exist_ok=False)
          proof=out/'source-scope.json'
          # SDK success never constructs protected startup admission. This
          # explicit unavailable proof cannot be upgraded to a native grant.
          sources=json.loads(pathlib.Path('integration/four_owner/cohort.json').read_text())['sources']
          heads={name:(os.environ['EXPECTED_HEAD'] if name=='unified_system' else spec['commit']) for name,spec in sources.items()}
          proof.write_text(json.dumps({'qualification':'PASS_SCOPED' if os.environ['SOURCE_JOB_RESULT']=='success' else 'NOT_RUN_OR_FAILED','source_job_result':os.environ['SOURCE_JOB_RESULT'],'provenance':'GITHUB_NEEDS_JOB_RESULT_NOT_NATIVE_ADMISSION','sources':heads,'release_status':'NO_GO','execution_authority':False,'trading_authorized':False,'reason':'SOURCE_SDK_IS_NOT_MANAGED_RUNTIME_ADMISSION'}))
          codes=[]
          for kind,script in [('managed-runtime','integration/verify_terminan_runtime.py'),('pipeline','integration/verify_pipeline.py'),('browser','integration/verify_chromium.py')]:
              codes.append(subprocess.run([sys.executable,'-I','-B',script,'--source-proof',str(proof),'--output',str(out/kind)]).returncode)
          if any(code!=1 for code in codes):raise RuntimeError('CLOSED_MIGRATION_GATE_RESULT_CHANGED')
          raise SystemExit(1)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canonical-four-mandatory-runtime-browser-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canonical-four-runtime-obligations/
          if-no-files-found: error
