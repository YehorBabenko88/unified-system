name: Offline contract tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-pinned full-suite test dependencies
        run: python -m pip install --only-binary=:all: --require-hashes -r docs/ci/requirements-unittest.lock
      - run: python scripts/ci_unittest.py
      - run: python -m unified_system.cli --demo
