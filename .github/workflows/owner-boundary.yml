name: Canonical four-owner source boundary and retained Root regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: YehorBabenko88/strattester
          ref: 5bb26e2f469c407c16bd4165ba80844db6e4379d
          path: .source/market_data
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: YehorBabenko88/math
          ref: 7b2e89b2818388913953ededbe106a225ec78ec9
          path: .source/math
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: YehorBabenko88/Terminan
          ref: b99913690ce29ce60e73414cc4d626ca989916ce
          path: .source/terminan
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install hash-pinned retained full-suite dependencies
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'-m','pip','install','--only-binary=:all:','--require-hashes','-r','docs/ci/requirements-unittest.lock'],check=True)
      - name: Retained actual full Root discovery (not replaced by SDK subset)
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'scripts/ci_unittest.py'],check=True)
      - name: Actual canonical CLI consumer and raw installed SDK boundary
        shell: python
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import os,pathlib,subprocess,sys
          subprocess.run([sys.executable,'-I','-B','scripts/verify_owner_boundary.py','--root-head',os.environ['EXPECTED_HEAD'],'--market-data','.source/market_data','--math','.source/math','--terminan','.source/terminan','--out',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'canonical-four-boundary')],check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canonical-four-boundary-${{ matrix.os }}
          path: ${{ runner.temp }}/canonical-four-boundary/
          if-no-files-found: error
