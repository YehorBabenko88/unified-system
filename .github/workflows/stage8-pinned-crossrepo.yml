name: Stage 8 pinned cross-repository installed candidate
on:
  pull_request:
    paths:
      - "integration_tests/**"
      - ".github/workflows/stage8-pinned-crossrepo.yml"
  push:
    paths:
      - "integration_tests/**"
      - ".github/workflows/stage8-pinned-crossrepo.yml"
permissions:
  contents: read
jobs:
  installed-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/math
          ref: 98d6783522aac7155cbb4635e5b29239746d88e0
          path: external/math
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/meta_analyse
          ref: b9755d749e598ec3e063740dd099cd8d922299bc
          path: external/meta_analyse
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/Terminan
          ref: f1abc777a8da0c8748c1cb80b37a09a8464340db
          path: external/Terminan
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/bybit-cluster-grid
          ref: f4dc0409e8ace1628a0e307675505f3a7b626dce
          path: external/bybit-cluster-grid
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/strattester
          ref: 1000dccd9ba85eafa4b72bc40a76afae73ca1cee
          path: external/strattester
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install reviewed Math wheel from exact source
        run: |
          python -m pip install --disable-pip-version-check setuptools==80.9.0 wheel==0.45.1
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps ./external/math
        shell: bash
      - name: Assert installed SDK and real Meta runtime 100k contract
        run: python -B -m unittest discover -s integration_tests -p test_stage8_crossrepo.py -v
        shell: bash
