name: Stage 8 pinned cross-repository installed candidate
on:
  workflow_dispatch:
    inputs:
      cohort:
        description: Exact-head manifest JSON (optional when using committed cohort)
        required: false
        type: string
  pull_request:
    paths:
      - "integration_tests/**"
      - ".github/workflows/stage8-pinned-crossrepo.yml"
  push:
    paths:
      - "integration_tests/**"
      - ".github/workflows/stage8-pinned-crossrepo.yml"
permissions:
  contents: read
jobs:
  installed-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Validate exact-head manifest
        id: cohort
        env:
          REQUESTED_COHORT: ${{ inputs.cohort }}
        run: python integration_tests/prepare_crossrepo_cohort.py
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/math
          ref: ${{ steps.cohort.outputs['math'] }}
          path: external/math
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/meta_analyse
          ref: ${{ steps.cohort.outputs['meta_analyse'] }}
          path: external/meta_analyse
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/Terminan
          ref: ${{ steps.cohort.outputs['Terminan'] }}
          path: external/Terminan
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/bybit-cluster-grid
          ref: ${{ steps.cohort.outputs['bybit-cluster-grid'] }}
          path: external/bybit-cluster-grid
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/strattester
          ref: ${{ steps.cohort.outputs['strattester'] }}
          path: external/strattester
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/unified-system
          ref: ${{ steps.cohort.outputs['unified-system'] }}
          path: external/unified-system
          persist-credentials: false
      - name: Fetch the historical Math parity object
        run: git -C external/math fetch --no-tags --depth 1 https://github.com/YehorBabenko88/math.git 3a9c542841e160f8b1924f155aaa2d1a676dfd04
      - name: Install Math, Terminan and Grid wheels from exact source
        env:
          SOURCE_DATE_EPOCH: '315532800'
        run: |
          python -m pip install --disable-pip-version-check setuptools==80.9.0 wheel==0.45.1 websockets==15.0.1 pytest==8.3.5 pytest-asyncio==0.26.0 httpx==0.28.1
          python -m pip wheel --disable-pip-version-check --no-build-isolation --no-deps \
            --wheel-dir candidate-wheels ./external/math ./external/Terminan ./external/bybit-cluster-grid
          python - <<'PY'
          import hashlib
          from pathlib import Path
          wheels = sorted(Path("candidate-wheels").glob("*.whl"))
          if len(wheels) != 3:
              raise SystemExit("Expected exactly three candidate wheels")
          with Path("candidate-wheel-sha256.txt").open("w", encoding="ascii") as output:
              for wheel in wheels:
                  with wheel.open("rb") as stream:
                      digest = hashlib.file_digest(stream, "sha256").hexdigest()
                  print(f"{digest}  {wheel.name}", file=output)
          PY
          python -m pip install --disable-pip-version-check candidate-wheels/*.whl
          python -m pip check
        shell: bash
      - name: Run independent acceptance and simulated recovery checks
        run: python -B -m unittest discover -s integration_tests -p 'test_*.py' -v
        shell: bash
      - name: Upload exact-head test cohort
        if: always() && steps.cohort.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crossrepo-cohort-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            integration_tests/crossrepo-cohort.json
            candidate-wheel-sha256.txt
          if-no-files-found: error
