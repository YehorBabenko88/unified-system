name: Stage 8 pinned cross-repository installed candidate
on:
  pull_request:
    paths:
      - "integration_tests/**"
      - ".github/workflows/stage8-pinned-crossrepo.yml"
  push:
    paths:
      - "integration_tests/**"
      - ".github/workflows/stage8-pinned-crossrepo.yml"
permissions:
  contents: read
jobs:
  installed-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/math
          ref: c12b2b4d177af5ed07ee3ea23854acf646cf06b2
          path: external/math
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/meta_analyse
          ref: c2e9318aeafacae4f3a44f926eec9a14b57eac36
          path: external/meta_analyse
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/Terminan
          ref: ffe7abfc172a97fffdbde1b2d388e73c016eddcf
          path: external/Terminan
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/bybit-cluster-grid
          ref: 531a19aa803bec840273656bdb8768a8466a44ad
          path: external/bybit-cluster-grid
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/strattester
          ref: d49eb69c52d469c153f5dbc147875a56134a656e
          path: external/strattester
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Math and Terminan wheels from exact source
        run: |
          python -m pip install --disable-pip-version-check setuptools==80.9.0 wheel==0.45.1 websockets==15.0.1
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps ./external/math ./external/Terminan
        shell: bash
      - name: Assert installed SDK and real Meta runtime 100k contract
        run: python -B -m unittest discover -s integration_tests -p test_stage8_crossrepo.py -v
        shell: bash
