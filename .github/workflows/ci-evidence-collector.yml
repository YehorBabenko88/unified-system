name: Root pinned confidential CI evidence collector
on:
  workflow_call:
    inputs:
      collector-sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  collector:
    if: github.repository == 'YehorBabenko88/math' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NODE_NO_WARNINGS: '1'
      NODE_DEBUG: ''
      NODE_DEBUG_NATIVE: ''
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
