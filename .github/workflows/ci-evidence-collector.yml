           const ref=process.env.QUALIFICATION_COLLECTOR_SHA;check(/^[a-f0-9]{40}$/.test(ref));for(let p=temp;;p=dirname(p)){check(lstatSync(p).isDirectory()&&!lstatSync(p).isSymbolicLink());if(dirname(p)===p)break;}
           const workspace=realpathSync(process.env.GITHUB_WORKSPACE),sourceDir=resolve(process.env.QUALIFICATION_ROOT_CHECKOUT);check(sourceDir===process.env.QUALIFICATION_ROOT_CHECKOUT&&dirname(dirname(sourceDir))===workspace&&/^[.]root-evidence-source-[A-Za-z0-9]{6}$/.test(sourceDir.slice(workspace.length+1).split('/')[0])&&sourceDir.endsWith('/root'));
           check((lstatSync(dirname(sourceDir)).mode&0o077)===0&&Number.isInteger(constants.O_NOFOLLOW)&&constants.O_NOFOLLOW>0);for(let part=join(sourceDir,'tools/ci_evidence');;part=dirname(part)){const st=lstatSync(part);check(st.isDirectory()&&!st.isSymbolicLink());if(dirname(part)===part)break;}const gitDir=lstatSync(join(sourceDir,'.git'));check(gitDir.isDirectory()&&!gitDir.isSymbolicLink());rootHead(readOwned(join(sourceDir,'.git/HEAD'),41),ref);
           const helperRaw=readOwned(join(sourceDir,'tools/ci_evidence/http_body.mjs'),131072);check(createHash('sha256').update(helperRaw).digest('hex')===manifest['tools/ci_evidence/http_body.mjs']);const helper=await import('data:text/javascript;base64,'+helperRaw.toString('base64'));check(typeof helper.readHttpBody==='function');
           const root=join(temp,'unified-ci-evidence-kit');mkdirSync(root,{mode:0o700});
