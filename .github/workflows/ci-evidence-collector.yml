            "tools/ci_evidence/tests/inert_public_diagnostics.mjs": "c8818f5808a0f3d45ed14fea56a1b83bbf0826c7d6c41c9ceb07bf71084ef6ff",
            "tools/ci_evidence/tests/inert_loader.mjs": "da2c0e9081001414f2e794575ccaafbc6fdd912016acaab3d05814461e928d11",
            "tools/ci_evidence/tests/inert_api_failures.mjs": "d4dbc9e2f059f7fd1af7c80eec8b5de7073973a1112e19acdb263a9c4361557b",
            "tools/ci_evidence/tests/inert_stage_codes.mjs": "752e0b41ad1b440030b9294ec274ea340b6b49c48aec72f8f5a53ce01568ba5d",
            "tools/ci_evidence/http_body.mjs": "cab089a1aaac6ef495279acb4967943750604461f9e4711b06cd0a64922c4d91"
          };
          let code='E_BOOTSTRAP';const temp=resolve(process.env.RUNNER_TEMP),publicFile=join(temp,'unified-ci-evidence-public/qualification.json');
          const check=ok=>{if(!ok)throw Error('CI_EVIDENCE_BLOCKED');};
          function readOwned(path,maximum){
           check(Number.isSafeInteger(maximum)&&maximum>0&&maximum<=131072);const fd=openSync(path,constants.O_RDONLY|constants.O_NOFOLLOW);
           try{const before=fstatSync(fd,{bigint:true});check(before.isFile()&&before.nlink===1n&&before.size>0n&&before.size<=BigInt(maximum));const raw=Buffer.alloc(maximum+1),count=readSync(fd,raw,0,raw.length,0);check(count===Number(before.size)&&count<=maximum);const after=fstatSync(fd,{bigint:true}),named=lstatSync(path,{bigint:true});check(after.isFile()&&named.isFile()&&!named.isSymbolicLink()&&after.nlink===1n&&named.nlink===1n&&['dev','ino','size','mtimeNs','ctimeNs'].every(k=>before[k]===after[k]&&after[k]===named[k]));return raw.subarray(0,count);}finally{closeSync(fd);}
