          node --input-type=module <<'ROOT_SOURCE'
          import{mkdtempSync,lstatSync,realpathSync,appendFileSync}from'node:fs';import{join,dirname,basename,isAbsolute}from'node:path';
          const check=ok=>{if(!ok)throw Error('ROOT_HELPER_CHECKOUT_BLOCKED');};
          function rootInput(value){if(typeof value!=='string'||!/^[a-f0-9]{40}$/.test(value))throw Error('ROOT_CHECKOUT_INPUT_REFUSED');return value;}
          try{
           const ref=rootInput(process.env.ROOT_BOOTSTRAP_REF);
           check(process.env.GITHUB_ACTIONS==='true'&&process.env.RUNNER_ENVIRONMENT==='github-hosted'&&process.platform==='linux'&&process.env.GITHUB_REPOSITORY==='YehorBabenko88/math'&&!process.env.NODE_OPTIONS&&!process.env.NODE_PATH&&!process.env.NODE_DEBUG&&!process.env.NODE_DEBUG_NATIVE);
           const declared=process.env.GITHUB_WORKSPACE;check(typeof declared==='string'&&declared.length<=4096&&isAbsolute(declared)&&!/[\r\n\0]/.test(declared));const workspace=realpathSync(declared);check(!/[\r\n\0]/.test(workspace));
           for(let part=workspace;;part=dirname(part)){const s=lstatSync(part);check(s.isDirectory()&&!s.isSymbolicLink());if(dirname(part)===part)break;}
           check(typeof process.env.GITHUB_OUTPUT==='string'&&isAbsolute(process.env.GITHUB_OUTPUT)&&!/[\r\n\0]/.test(process.env.GITHUB_OUTPUT));
           const parent=mkdtempSync(join(workspace,'.root-evidence-source-'));check((lstatSync(parent).mode&0o077)===0);
           appendFileSync(process.env.GITHUB_OUTPUT,'source_sha='+ref+'\ncheckout_path='+basename(parent)+'/root\ncheckout_abs='+join(parent,'root')+'\n');console.log('ROOT_HELPER_CHECKOUT_INPUT_READY');
          }catch{console.error('ROOT_HELPER_CHECKOUT_BLOCKED');process.exitCode=1;}
          ROOT_SOURCE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: YehorBabenko88/unified-system
          ref: ${{ steps.bootstrap_source.outputs.source_sha }}
          path: ${{ steps.bootstrap_source.outputs.checkout_path }}
          persist-credentials: false
          fetch-depth: 1
          set-safe-directory: false
          submodules: false
          lfs: false
      - name: Verify Root tool bytes and qualify only the Math workload
        id: collect
        env:
          QUALIFICATION_COLLECTOR_SHA: ${{ inputs.collector-sha }}
          QUALIFICATION_ROOT_CHECKOUT: ${{ steps.bootstrap_source.outputs.checkout_abs }}
