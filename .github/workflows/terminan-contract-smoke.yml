name: Pinned Terminan source contract smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: YehorBabenko88/Terminan
          ref: 81793290113a457ee8c038600639c3b8cbe78020
          path: upstream/Terminan
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test "$(git -C upstream/Terminan rev-parse HEAD)" = "81793290113a457ee8c038600639c3b8cbe78020"
      - run: python -m scripts.verify_terminan_contract upstream/Terminan
