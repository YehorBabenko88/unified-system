name: H R35 original G eight-dataset SQLite baseline (isolated)
on:
  pull_request:
    paths:
      - 'tests/test_h_round35_original_g_sqlite_eight.py'
      - 'docs/functional-coverage/round35-market-dataset-parity-gates.json'
      - '.github/workflows/h-round35-g-sqlite-parity.yml'
permissions:
  contents: read
jobs:
  original-g-eight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact immutable G123 test-only source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/strattester
          ref: ae6a47434dec459584105c5f877f749bc7676b16
          path: .source/strattester-g123
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Original G8 actual SQLite source with exact blob identity
        run: python -B -m unittest -v tests.test_h_round35_original_g_sqlite_eight
