name: H R35 original G SQLite and Meta/Math consumer parity (isolated)
on:
  pull_request:
    paths:
      - 'tests/test_h_round35_original_g_sqlite_eight.py'
      - 'docs/functional-coverage/round35-market-dataset-parity-gates.json'
      - 'tests/test_h_round35_meta_original_consumer_math.py'
      - 'tests/test_h_round35_meta_owner_migration.py'
      - 'docs/functional-coverage/round35-meta-unique-migration-plan.json'
      - 'docs/functional-coverage/meta-stage6-crosswalk-round33.json'
      - '.github/workflows/h-round35-g-sqlite-parity.yml'
permissions:
  contents: read
jobs:
  original-g-eight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact immutable G123 test-only source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/strattester
          ref: fa9e0ff2235b35466a03c78781a80d42dbe1c4af
          path: .source/strattester-g123
          persist-credentials: false
      - name: Exact immutable Meta Analyse original consumers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/meta_analyse
          ref: b1a4d6a41054f0040a88dc80b585380fb6b4f323
          path: .source/meta-h35
          persist-credentials: false
      - name: Exact immutable canonical Math only for test consumer seam
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/math
          ref: 9e6acbd9e12a91189f57234828e31640983af553
          path: .source/math-h35
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Original G8 and Meta/Math immutable-source retention and consumer semantics
        run: python -B -m unittest -v tests.test_h_round35_original_g_sqlite_eight tests.test_h_round35_meta_original_consumer_math tests.test_h_round35_meta_owner_migration
