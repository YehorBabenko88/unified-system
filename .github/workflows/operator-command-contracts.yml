name: Operator command contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operator-command-${{ github.ref }}
  cancel-in-progress: false
jobs:
  operator-command-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_UNIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: unified
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Create isolated evidence directory
        run: mkdir "$RUNNER_TEMP/operator-command-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Verify exact Root source tree before dependency setup
        run: >-
          python -I -S -B -X "pycache_prefix=$RUNNER_TEMP/operator-command-${{ github.run_id }}-${{ github.run_attempt }}/cache" unified/scripts/operator_contract_ci.py
          --unified "$GITHUB_WORKSPACE/unified"
          --expected-unified "$EXPECTED_UNIFIED_SHA"
          --report "$RUNNER_TEMP/operator-command-${{ github.run_id }}-${{ github.run_attempt }}/source-before.json"
      - name: Install hashlocked modeled fixture dependencies on ephemeral runner
        run: |
          python -m venv "$RUNNER_TEMP/operator-fixture-venv"
          "$RUNNER_TEMP/operator-fixture-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r unified/docs/ci/operator-command/requirements-linux.lock
          "$RUNNER_TEMP/operator-fixture-venv/bin/python" -m pip check
      - name: Required actual Gateway and Root command-store composition with exact test inventory
        working-directory: unified
        run: |
          "$RUNNER_TEMP/operator-fixture-venv/bin/python" -I -S -B -X "pycache_prefix=$RUNNER_TEMP/operator-command-${{ github.run_id }}-${{ github.run_attempt }}/cache" scripts/run_operator_command_contracts.py --expected-head "$EXPECTED_UNIFIED_SHA" --dependencies "$RUNNER_TEMP/operator-fixture-venv/lib/python3.12/site-packages" --basetemp "$RUNNER_TEMP/operator-pytest-${{ github.run_id }}-${{ github.run_attempt }}" --junit "$RUNNER_TEMP/operator-command-${{ github.run_id }}-${{ github.run_attempt }}/contracts.xml" --origins "$RUNNER_TEMP/operator-command-${{ github.run_id }}-${{ github.run_attempt }}/origins.json"
      - name: Verify evidence helper invariants
        working-directory: unified
        run: python -I -S -B -X "pycache_prefix=$RUNNER_TEMP/operator-command-${{ github.run_id }}-${{ github.run_attempt }}/helper-cache" -c 'import pathlib,sys,unittest; cache=pathlib.Path(sys.pycache_prefix); assert not cache.exists(); sys.path.insert(0,"."); r=unittest.TextTestRunner().run(unittest.defaultTestLoader.loadTestsFromName("tests.test_operator_contract_ci")); assert not cache.exists(); sys.exit(not (r.wasSuccessful() and r.testsRun==6 and not r.skipped and not r.expectedFailures and not r.unexpectedSuccesses))'
      - name: Required exact inventory and final source receipt
        run: >-
          python -I -S -B -X "pycache_prefix=$RUNNER_TEMP/operator-command-${{ github.run_id }}-${{ github.run_attempt }}/cache" unified/scripts/operator_contract_ci.py
          --unified "$GITHUB_WORKSPACE/unified"
          --expected-unified "$EXPECTED_UNIFIED_SHA"
          --junit "$RUNNER_TEMP/operator-command-${{ github.run_id }}-${{ github.run_attempt }}/contracts.xml"
          --report "$RUNNER_TEMP/operator-command-${{ github.run_id }}-${{ github.run_attempt }}/source-after.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        id: evidence
        with:
          name: operator-command-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/operator-command-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
      - name: Publish artifact digest receipt
        if: always()
        env:
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          printf 'SYNTHETIC_AUTH; MODELED_CONSUL; dependency integrity INSTALL_HASH_ONLY; installed wheel tree verification NOT_RUN; native SSPI and physical acceptance NOT_RUN\nArtifact SHA256: %s\nURL: %s\n' "$ARTIFACT_DIGEST" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
