name: Retired status consumer archive custody only
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-custody-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify raw archives and explicit held role contracts
        shell: bash
        run: |
          python -I -S -B -X "pycache_prefix=$RUNNER_TEMP/status-custody-tests" - <<'PY'
          import sys,unittest
          sys.path.insert(0,'.')
          result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromName('tests.test_retired_status_consumers'))
          assert result.testsRun==5 and result.wasSuccessful() and not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses
          PY
      - name: Archive custody receipt is not runtime acceptance
        shell: bash
        run: python -I -S -B -X "pycache_prefix=$RUNNER_TEMP/status-custody-receipt" scripts/verify_retired_status_consumers.py --output "$RUNNER_TEMP/status-consumer-custody.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: status-consumer-archive-custody-only
          path: ${{ runner.temp }}/status-consumer-custody.json
          if-no-files-found: error
