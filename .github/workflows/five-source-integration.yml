name: Actual six-source disposable integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: actual-six-source-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  source-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/Terminan
          ref: 7f23e746a3a52163c3065975ff02d6a7ae790129
          path: .source/terminan
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/math
          ref: 191a119b8a00e97d61549280f9dcbe5ae9f3a7cd
          path: .source/math
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/bybit-cluster-grid
          ref: d2dcffb43e520db75936eb97389b66db2f3e1365
          path: .source/grid
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/strattester
          ref: 1d654150b03932ac4efe7e99a6e3c50b4e020fff
          path: .source/strattester
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/meta_analyse
          ref: faa7a20339ef9dba5530a7bc521efb8d1469827a
          path: .source/meta_analyse
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Exact checkout fence and full suite
        shell: python
        run: |
          import subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == '${{ github.event.pull_request.head.sha || github.sha }}'
          subprocess.run(['python','-m','unittest','discover','-s','tests','-v'],check=True)
      - name: Real source APIs and bounded Math worker
        run: python integration/verify_sources.py --terminan .source/terminan --math .source/math --grid .source/grid --strattester .source/strattester --meta-analyse .source/meta_analyse --output five-source-evidence
      - name: Install historical contract test runner
        run: python -m pip install "pytest>=8.2,<10"
      - name: Actual Grid Math backtest scientific result and Terminan admission
        run: python integration/verify_pipeline.py --terminan .source/terminan --math .source/math --grid .source/grid --strattester .source/strattester --meta-analyse .source/meta_analyse --output five-source-evidence
      - run: npm ci --prefix integration
      - run: node integration/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Actual Chromium actual Terminan server actual lifecycle snapshots
        run: python integration/verify_chromium.py --terminan .source/terminan --math .source/math --grid .source/grid --strattester .source/strattester --meta-analyse .source/meta_analyse --output five-source-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actual-six-source-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_attempt }}
          path: five-source-evidence/
          if-no-files-found: error
