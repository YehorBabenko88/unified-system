name: Actual six-source disposable integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: actual-six-source-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  source-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/Terminan
          ref: a23cd77622af7bf04788fe5e32a03d930c08ebfc
          path: .source/terminan
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/math
          ref: 191a119b8a00e97d61549280f9dcbe5ae9f3a7cd
          path: .source/math
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/bybit-cluster-grid
          ref: 1e30b49c0aaa826e5edf54d7652fd424cc7d566d
          path: .source/grid
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/strattester
          ref: 1d654150b03932ac4efe7e99a6e3c50b4e020fff
          path: .source/strattester
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YehorBabenko88/meta_analyse
          ref: a61adb48bc3718efe8ec99b915e85741ae8142af
          path: .source/meta_analyse
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Exact checkout fence and full suite
        shell: python
        run: |
          import subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == '${{ github.event.pull_request.head.sha || github.sha }}'
          subprocess.run(['python','-m','unittest','discover','-s','tests','-v'],check=True)
      - name: Real source APIs and bounded Math worker
        shell: python
        run: |
          import subprocess,sys
          command=[sys.executable,'integration/verify_sources.py','--terminan','.source/terminan','--math','.source/math','--grid','.source/grid','--strattester','.source/strattester','--meta-analyse','.source/meta_analyse','--output','five-source-evidence']
          result=subprocess.run(command,capture_output=True,text=True)
          sys.stdout.write(result.stdout);sys.stderr.write(result.stderr)
          if result.returncode:
              # Public synthetic CI diagnostics only; no inventory/credentials.
              lines=(result.stdout+'\n'+result.stderr).splitlines()
              detail=' | '.join(lines[-8:])[-1500:]
              detail=detail.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error title=Exact source API qualification::'+detail)
          raise SystemExit(result.returncode)
      - name: Install historical contract test runner
        run: python -m pip install "pytest>=8.2,<10"
      - name: Actual Grid Math backtest scientific result and Terminan admission
        run: python integration/verify_pipeline.py --terminan .source/terminan --math .source/math --grid .source/grid --strattester .source/strattester --meta-analyse .source/meta_analyse --output five-source-evidence
      - run: npm ci --prefix integration
      - name: Install pinned Chromium and native dependencies
        shell: python
        run: |
          import subprocess,sys
          result=subprocess.run(['node','integration/node_modules/@playwright/test/cli.js','install','--with-deps','chromium'],capture_output=True,text=True)
          sys.stdout.write(result.stdout);sys.stderr.write(result.stderr)
          if result.returncode:
              lines=(result.stdout+'\n'+result.stderr).splitlines()
              errors=[line for line in lines if line.startswith('E: ') or 'Error:' in line or 'error:' in line or 'not found' in line]
              detail=' | '.join((errors or lines)[-8:])[-1500:]
              detail=detail.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error title=Pinned browser dependency install::'+detail)
          raise SystemExit(result.returncode)
      - name: Actual Chromium actual Terminan server actual lifecycle snapshots
        run: python integration/verify_chromium.py --terminan .source/terminan --math .source/math --grid .source/grid --strattester .source/strattester --meta-analyse .source/meta_analyse --output five-source-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actual-six-source-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_attempt }}
          path: five-source-evidence/
          if-no-files-found: error
