name: Isolated local result byte graph
on:
  push:
    branches: [feature/storage-result-publication-20261107]
  pull_request:
    paths:
      - unified_system/storage/result_publication.py
      - unified_system/storage/replica_evidence.py
      - tests/storage/result_publication/**
      - docs/storage/result-publication/**
      - .github/workflows/gateway-result-publication.yml
permissions:
  contents: read
jobs:
  local-byte-graph:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Preserve exact primary source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Verify exact source before imports and run local-only cases
        env:
          A4_RESULT_EVIDENCE: ${{ runner.temp }}/gateway-result-byte-evidence
          A4_RESULT_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -I -S -B tests/storage/result_publication/qualify.py
      - name: Upload bounded local evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: result-byte-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gateway-result-byte-evidence
          if-no-files-found: error
          retention-days: 14
