name: Diagnostic Windows P0 (Workstream A, MASTER #111)
# Diagnostic only: measures, never changes product/test bounds or protections.
on:
  push:
    branches: ['claude/a-windows-ps-diagnostic-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powershell-timing:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Round 3 - hardened prelude timing
        run: python -B tools/diagnostics/windows_powershell_hardened.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: powershell-timing-${{ matrix.os }}
          path: bisect.json
          if-no-files-found: warn
