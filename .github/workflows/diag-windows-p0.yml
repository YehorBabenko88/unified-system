name: Diagnostic Windows P0 (Workstream A, MASTER #111)
# Diagnostic only: measures, never changes product/test bounds or protections.
on:
  push:
    branches: ['claude/a-windows-ps-diagnostic-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powershell-timing:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Round 2 - bisect the missing environment for Windows PowerShell 5.1
        run: python -B tools/diagnostics/windows_powershell_bisect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: powershell-timing-${{ matrix.os }}
          path: bisect.json
          if-no-files-found: warn
  lan-mtls-disconnect:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: --require-hashes -r docs/ci/requirements-unittest.lock'
      - name: Repeat the failing large-message mTLS test 5x (deadlines unchanged)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            echo "=== attempt $i"
            PYTHONPATH=tests python -X faulthandler -m unittest -v tests.test_lan_mux_channel.MuxTlsTests.test_complete_large_messages_real_mtls_and_budget_overhead 2>&1 | tail -60 || true
          done
