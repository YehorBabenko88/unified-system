name: Actual Unified Supervisor to Terminan disposable HTTP
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: YehorBabenko88/Terminan
          ref: d7df874f0d9b2561749e686d4419f8e1538c84d0
          path: upstream/Terminan
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test "$(git -C upstream/Terminan rev-parse HEAD)" = "d7df874f0d9b2561749e686d4419f8e1538c84d0"
      - run: python -m scripts.verify_real_supervisor_terminan upstream/Terminan
