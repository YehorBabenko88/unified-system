name: Actual Unified Supervisor to Terminan disposable HTTP
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: YehorBabenko88/Terminan
          ref: ffddb9d52355fbd7bd8538b6a68813b6d6a644f2
          path: upstream/Terminan
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test "$(git -C upstream/Terminan rev-parse HEAD)" = "ffddb9d52355fbd7bd8538b6a68813b6d6a644f2"
      - run: python -m scripts.verify_real_supervisor_terminan upstream/Terminan
